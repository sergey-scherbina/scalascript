# ScalaScript 3 — its gates, run by something other than a person remembering to.
#
# WHY THIS FILE EXISTS. Measured 2026-08-08: `v3` appears in NO workflow, in no script under
# `scripts/`, and not in `scripts/smoke-ci.ssc`. Every one of v3's gates — selftest, exec, bridge,
# parity, front, front-report — is run by hand, and they are good gates: they caught a parser change
# that silently dropped two statements the same day they were run.
#
# That is the second suite found unwired this week; the first was `@scalascript/control-direct`,
# whose 496 lines of tests nothing invoked for three weeks while eleven BUGS entries sat open
# waiting for a signal they could never receive. A suite nobody runs is worse than a red one: a red
# suite at least says something.
#
# Its own file rather than a job in ci.yml, for the same reason js-packages.yml has one: the
# push-path budget should not be the reason a suite stays unwired, and these gates need none of
# that suite's setup.
name: v3

# `v2/**` IS IN THE TRIGGER, and leaving it out cost a red `main` nobody could have seen coming.
#
# v3 has two lanes and invariant I-3 says they agree. The `exec` lane is v3's own interpreter; the
# `--bridge` lane emits Core IR and runs it **on the v2 runtime**. So `v2/src/Runtime.scala` is not
# a neighbouring project — it is half of what `exec-gate.sh` compares, and a path filter of `v3/**`
# made that half unwatched.
#
# Measured 2026-08-10. `f39448c96` changed `charAt` to yield a Char on every lane, touching
# `v2/src/Runtime.scala` and `v2/lib/string.ssc0` and nothing under `v3/`. This workflow did not
# run. Four commits later a push that touched only two gate SCRIPTS and a markdown file triggered
# it, and `executor differential` went red on `char-literals`:
#
#     executor  x/121/A/98/true/sq      <- v3's own interpreter, still the character CODE
#     bridge    x/121/A/b/true/sq       <- the v2 runtime, now the CHARACTER
#
# The lanes had disagreed for four commits. The claim that made the change scoped
# `v2/src/Runtime.scala` and the rust backend — reasonably, since nothing told anyone that v3's
# executor implements the same primitive.
#
# THE COST IS REAL AND IS THE POINT: v3's gates now run on every push that touches `v2/`. That is
# the price of the bridge lane being a bridge. The alternative is what just happened — the
# divergence is found by whoever next touches an unrelated file under `v3/`.
# `uniml/**` IS ALSO IN THE TRIGGER, added 2026-08-15, and it costs nothing measurable.
#
# uniml is half of what `v3/front-gate.sh` runs — the DEFAULT front — so a change there is a change
# to what this workflow tests, exactly as `v2/**` is for the bridge lane. Leaving it out is the same
# hole the `v2/**` note above describes, and the same hole cost four commits of undetected lane
# divergence then. (v3/BUGS.md `v3-workflow-does-not-trigger-on-uniml-…`.)
#
# THE COST, measured before adding rather than assumed: of the last 300 commits on `main`, `uniml/`
# is touched by ONE, and by ZERO that do not already touch `v3/` or `v2/`. So this adds no runs to
# today's traffic; it closes the case where somebody works on uniml alone, which is precisely when
# nobody is watching the front gate's other half.

# `v2/**` CAME OUT OF THE PUSH TRIGGER 2026-08-15, and the two paragraphs above are kept because
# they are the argument AGAINST doing that. It is a deliberate trade, made with the numbers in
# front of it rather than to make a graph look better.
#
# COUNTED over the last 300 commits on `main`: 48 of them trigger this workflow — 32 touch
# `v3/`/`uniml/`, and **16 touch `v2/` and nothing under `v3/` or `uniml/`**. The intersection is
# ZERO. So dropping `v2/**` removes one run in three, and the 16 it removes are exactly the
# population the paragraph above is worried about: a change to the bridge's runtime with no v3 file
# beside it.
#
# WHY IT IS STILL THE RIGHT TRADE HERE. Runs are ~26 minutes and arrive in bursts; a pending run in
# a concurrency group is cancelled by the next arrival WHATEVER `cancel-in-progress` says, so a
# third fewer arrivals is a third fewer evictions, and the runs that do start are likelier to
# report. A suite that answers is worth more than a suite that is triggered.
#
# AND THE 16 ARE NOT DROPPED, THEY ARE DEFERRED: `schedule` runs the whole thing nightly, so v2
# drift is caught within a day instead of within a push — which is still far inside the four
# commits it went undetected for last time. `workflow_dispatch` is there for anyone who touches
# `v2/` and wants the answer now, and that is the button to use rather than a v3 file edited to
# provoke a run.
on:
  push:
    branches: [main]
    paths:
      - 'v3/**'
      - 'uniml/**'
      - '.github/workflows/v3.yml'
      # A BOARD EDIT CANNOT BREAK A GATE, and 47% of the arrivals were board edits: of the 85
      # commits touching these paths in three days, 40 changed ONLY `.md` under `v3/`. Each fired a
      # 45-minute suite that can tell nothing about a heading, and — this is the part that cost
      # something — each one evicted a pending run that could have reported. Checked before writing
      # the line rather than assumed: every step in this file runs a `v3/*.sh` gate against code,
      # and none of them reads BUGS.md, SPRINT.md, BACKLOG.md or a spec. If a gate ever starts
      # validating the boards, this exclusion silently drops it — that is the trade being made here.
      - '!v3/**.md'
  pull_request:
    paths:
      - 'v3/**'
      - 'uniml/**'
      - '.github/workflows/v3.yml'
      - '!v3/**.md'
  schedule:
    # 03:17 UTC — an odd minute on purpose, so this does not queue behind every other nightly in
    # the account at the top of the hour and lose its runner to the same contention it is here to
    # avoid.
    - cron: '17 3 * * *'
  workflow_dispatch:

# CANCELLING COST THIS WORKFLOW 95 % OF ITS VERDICTS. Measured 2026-08-15 over its last 100 runs
# (2026-08-13 → 2026-08-15): **cancelled 75, failure 19, success 5**. A gate that answers about one
# commit in twenty is not protecting v3, and 75 % of its history reads RED without having tested
# anything — which is worse than silence, because a red history is what people stop reading.
#
# THE ENTRY'S DIAGNOSIS WAS "main's push interval is shorter than the suite", AND THE NUMBERS SAY
# OTHERWISE. Runs are created at **1.7 per hour** over 58 hours — one every ~35 minutes — against a
# suite whose completed runs take a median of **26 minutes**. On average a run has time to finish.
# What kills them is that the arrivals are BURSTY: several `v3/`/`v2/` commits land within minutes,
# and each one evicts the last. Cancelled runs die at a median of 5.9 min, well short of the 26 they
# need. The fix therefore is not "run less" — it is "do not kill a run that is already executing".
#
# `false`, and NOT the "no group at all" that `smoke.yml` carries, even though that file's header is
# where this disease was first cured. Its position is justified there by a specific fact: smoke is
# ONE job of ~6 minutes that skips sbt on a cache hit, so 25 runs/hour is affordable. This suite is
# ~26 minutes and builds an sbt project before its first gate. Copying the conclusion without the
# premise is how a cure becomes a cargo cult; `ci.yml` uses `false` for its heavy jobs for the same
# reason, and its note says why in the same words: a run that is ALREADY EXECUTING is never killed,
# so it reaches a verdict, and GitHub replaces the PENDING one instead.
#
# What that buys, arithmetically: a burst of three commits used to produce zero verdicts and now
# produces two — the first (which finishes) and the last (which the pending slot collapses to). At
# 1.7 runs/hour the worst-case runner cost is ~44 minutes per hour, unchanged in order of magnitude.
#
# WHAT TO WATCH, and what it would mean: if `cancelled` stays high after this, the cancels are no
# longer coming from concurrency and the next suspect is the 45-minute job timeout or the account's
# concurrent-job budget — neither of which this line can fix. The measurement to repeat is
# `gh run list --workflow v3.yml --limit 100 --json conclusion`.
# MEASURED, AND IT CONFIRMS THE PARAGRAPH ABOVE WITH A COUNT rather than adding a new theory. Of
# the twelve runs cancelled after `cancel-in-progress: false` landed, TWELVE had a newer run created
# on the same branch while they were still alive. Better than the timing: a cancelled run has ZERO
# JOBS in the API (`/actions/runs/<id>/jobs` returns an empty array) while a completed one has two,
# so those runs never executed a step at all — they were evicted while waiting in this group, which
# is the one thing `cancel-in-progress: false` cannot prevent. The job timeout is ruled out by the
# same data: these die at a 7-minute median against limits of 45 and 60.
#
# ONE GROUP PER COMMIT ON main, SO NOTHING CAN EVICT ANYTHING — the owner's decision once the cost
# was named, and the cost turned out to be zero: this repository is PUBLIC, and GitHub bills no
# minutes for standard runners on a public repository. The lever that was rejected as "fewer
# arrivals is cheaper" was only cheaper against a bill that does not exist.
#
# WHAT REPLACES THE BILL AS THE REAL LIMIT is the account's concurrent-JOB cap — 20 for this plan —
# and this workflow uses two jobs per run, so ten runs can execute at once. Against ~15 commits a day
# reaching these paths, a burst would have to be six times anything in the last three days to touch
# it. If that cap is ever hit, GitHub queues rather than cancels, so the failure mode is slowness and
# not a lost verdict.
#
# A PULL REQUEST KEEPS THE OLD BEHAVIOUR, and deliberately: there, cancelling the run for a commit
# that has just been replaced is right, because only the tip of a branch needs an answer. On `main`
# every commit is permanent and every one of them deserves its own verdict — that is the whole
# difference, and it is why the group key and the cancel flag both switch on the event.
concurrency:
  group: v3-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: v3 gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # `v3/ssc3` fetches the Scala compiler with coursier, so `cs` has to be here. Mirrors the
      # Linux branch of the repository's own `setup.sh`, which is where a developer gets it —
      # `v3/SPRINT.md` item 31e records why it became a first-class requirement: scala-cli used to
      # bundle a copy, and v3 stopped going through scala-cli.
      #
      # THIS STEP IS WHY THE JOB WAS RED ON ALL TEN OF ITS RUNS, from the commit that introduced it.
      # The comment that stood here said "the kernel builds with the JDK and nothing else —
      # invariant I-1 — so nothing is installed for these", and that is a MISREADING of I-1.
      # `00-charter.md` defines I-1 as an empty `libraryDependencies` and no kernel import outside
      # `java.*`/`scala.*` — a property of the ARTIFACT. It says nothing about build tooling, and it
      # cannot: the kernel is written in Scala, so compiling it needs a Scala compiler no matter how
      # dependency-free the result is. Installing `cs` does not weaken I-1; the gate for I-1 is the
      # dependency-list check named in the charter, not the absence of a setup step here.
      - name: Setup coursier
        run: |
          set -euo pipefail
          if ! command -v cs >/dev/null 2>&1; then
            curl -fL "https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz" \
              | gzip -d > "$RUNNER_TEMP/cs"
            chmod +x "$RUNNER_TEMP/cs"
            sudo mv "$RUNNER_TEMP/cs" /usr/local/bin/cs
          fi
          cs --version

      # THIS JOB NEEDS THE UNIML FRONT, and not registering it is why it had never been green:
      # 48 runs listed on 2026-08-09, 0 successes, back to at least 2026-08-08. `exec-gate.sh` and
      # `front-gate.sh` both carry `.uniml-only` fixtures — programs v3's own parser refuses — and
      # both go RED rather than skip when the front is absent, deliberately, because a gate that
      # goes green with fixtures unrun reports less than it claims. On CI it was always absent.
      #
      # The step existed, in the OTHER job, with a comment reading "SEPARATE JOB because this one
      # costs an sbt build". That reasoning was never priced: measured on run 31321407887, the step
      # takes 0.8 min against a `gates` job that died at 2.2. The saving was not a saving — it was
      # paid for with a job that could not pass, and with every step below this one skipped on every
      # run since it was written.
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Register the UniML front
        run: v3/uniml-classpath.sh

      # LOUD AND FIRST, because the silent version already cost a red run and an archaeology
      # session. Since 46bccf742 the fleet is ON by default, so the driver builds `plugins.cp`
      # on first use with output DISCARDED (`fleet_cp`'s contract: a build failure must not stop
      # `ssc3 run`). On 2026-08-18 CI's sbt exported something that was not a classpath, the
      # driver's compile of `v3/plugins` failed with 75 `Not found: ssc` errors it never showed,
      # and the fallback unregistered the UNIML FRONT — so the visible symptom was
      # `front-capability-gate: CANNOT RUN`, two layers from the cause. Building here makes the
      # failure name itself (plugin-classpath.sh now validates every exported entry exists), and
      # a fleet that cannot build fails THIS step instead of silently shrinking what the gates
      # measure — it is the default users get, so CI must measure it or say loudly that it cannot.
      - name: Build the plugin fleet
        run: v3/plugin-classpath.sh

      # THE THIRD CLASSPATH, and it was the missing one. `v3/.jars/` holds three per-checkout files
      # and this workflow built two of them. Without `jvm.cp` an import of a JVM PACKAGE has nothing
      # to resolve against, so v3 falls back — correctly — to treating it as a FILE import and
      # refuses with four candidate paths to a file that cannot exist. `jvm-package-import` was red
      # in `executor differential`, `front` and `front differential` on every run since the fixture
      # landed (dff03be59), and green in every checkout where a person had ever run this script.
      # That is the same shape as the `uniml.cp` entry: a gate whose colour depends on the CHECKOUT
      # rather than on the code. Costs one sbt export, beside the two already here.
      - name: Register the importable JVM packages
        run: v3/jvm-classpath.sh

      # `if: !cancelled()` ON EVERY GATE, and it is the second half of the same defect. A step that
      # fails stops the job, so ONE red gate hid the other five — `bridge`, `parity`, `front`,
      # `front report` and both jit steps reported nothing at all while `executor differential` was
      # red, and nobody could see whether they would have passed. The job is still red if any gate
      # is red; what changes is that all of them now say so. `!cancelled()` rather than `always()`
      # so a cancelled run stops promptly instead of grinding through six gates nobody is waiting
      # for. It still earns its keep with `cancel-in-progress: false` above — a run can be cancelled
      # by hand, by the 45-minute job timeout, or by a superseded PR head — but it is no longer the
      # common case; this parenthesis used to say "this workflow has `cancel-in-progress: true`" and
      # was left behind by the change above.
      #
      # The driver caches a jar per SOURCE DIGEST, which is why the first gate pays for the compile
      # and the rest do not.
      - name: selftest
        run: v3/selftest.sh
      - name: executor differential
        if: ${{ !cancelled() }}
        run: v3/exec-gate.sh
      - name: bridge
        if: ${{ !cancelled() }}
        run: v3/bridge-gate.sh
      - name: parity
        if: ${{ !cancelled() }}
        run: v3/parity-gate.sh
      - name: front
        if: ${{ !cancelled() }}
        run: v3/front-gate.sh
      - name: front report
        if: ${{ !cancelled() }}
        run: v3/front-report-gate.sh

      # THE EFFECTS FIXTURES. `v3/tests/effects/` held 15 files that NO gate read — not this
      # workflow, not `exec-gate.sh`, not `front-gate.sh` — so they were exercised only by hand,
      # and 10 of them had no recorded expectation at all. One lane on purpose: `BridgeV2` has no
      # case for `Handle`, `Perform` or `Resume`, so the executor-versus-bridge differential would
      # report the bridge printing nothing, which is true and useless.
      - name: effects
        if: ${{ !cancelled() }}
        run: v3/effects-gate.sh

      # EVERY HAND-WRITTEN `Expr` WALKER HANDLES EVERY CASE THAT HAS CHILDREN. Six of them live in
      # `Lower.scala` and nothing failed when one missed a case — most end in a catch-all, so the
      # compiler is satisfied and the walk silently skips a subtree. Three were missed in one day
      # while adding a single node, each announcing itself hours apart and one of them a hole that
      # PREDATED the node. Self-test first, for the same reason the jit gate runs its own.
      - name: walkers — self-test
        if: ${{ !cancelled() }}
        run: v3/walker-gate.sh --self-test
      - name: walkers
        if: ${{ !cancelled() }}
        run: v3/walker-gate.sh

      # THE BENCH CORPUS IS A SEPARATE SET, and every other gate here reads tests/conformance. A
      # change can stop a bench row computing and nothing says a word — `typeclass-fold` did
      # exactly that for three days while `N` stayed at 191. This asks only whether each row still
      # produces a number, never how fast: timing on a shared runner is noise, and the value oracle
      # is exec-gate's job.
      - name: bench corpus — self-test
        if: ${{ !cancelled() }}
        run: v3/bench-corpus-gate.sh --self-test
      - name: bench corpus
        if: ${{ !cancelled() }}
        run: v3/bench-corpus-gate.sh

      # THE ONE GATE HERE THAT IS NOT A DIFFERENTIAL, and that is why it exists. Every check above
      # compares two things that should agree — two fronts, two lanes. The import resolver has no
      # second opinion to compare against: both fronts share it, so a file NEITHER front can load
      # produces no output for either to disagree about. That blind spot cost 116 corpus files,
      # 69% of every refusal the default front produced, when `std-to-repo-root` moved the modules
      # and v3's loader kept looking at `v1/runtime/` — and nothing above went red for a day.
      #
      # `--self-test` is NOT run here, deliberately and with the cost named: it plants two defects
      # in `Loader.scala` and rebuilds the kernel for each, which is two extra compiles on a job
      # whose whole point is that the first gate pays for the compile and the rest do not. It is
      # run by hand when the resolver changes; the gate itself is cheap.
      - name: loader
        if: ${{ !cancelled() }}
        run: v3/loader-gate.sh

      # THE GATE THAT DECIDES THE FRONT SWAP, and until now it ran only when someone remembered.
      # `v3/specs/40-front-on-uniml.md` §7 makes this the adoption criterion — every fixture and
      # every corpus case printing the same `Ast` on both fronts — and it was in no workflow at all,
      # in a file whose own header argues that a suite nobody runs is worse than a red one.
      #
      # What that cost, measured: on 2026-08-10 the corpus carried TWO disagreements (`derives` and
      # `summon`) against a ceiling of 0, and nothing said so. They were found by hand, filed, and
      # closed by 89f6f3e0a — but the window in which a differential disagreement can sit unnoticed
      # is exactly as long as the interval between two people choosing to run this.
      #
      # Wired only now, and the order was the point: adding the step while it was red would have
      # turned `main` red for everyone over a defect its author had not seen. Fixed first, then
      # wired.
      - name: front differential
        if: ${{ !cancelled() }}
        run: v3/front-diff.sh

      # The prelude is the mechanism that unblocked option 3 of the DATASET decision — a library in
      # ScalaScript instead of host surface. Cheap (it writes its own probe prelude into a temp dir
      # and never touches the tree) and it checks the two properties that broke or would break
      # silently: the printed `Ast` must stay free of the prelude, or every `.expected` fixture is
      # rewritten; and an empty program must still be refused, which is a consistency check between
      # `Loader`'s emptiness test and `Lower.scala`'s.
      - name: prelude
        if: ${{ !cancelled() }}
        run: v3/prelude-gate.sh

      # THE SELF-TEST RUNS FIRST, and that ordering is the point. This gate's green means "no method
      # is over the JVM's compile limit except the ones declared" — a claim nothing else in CI can
      # contradict, because a program whose methods are too big to compile is still CORRECT. So the
      # run that asserts it also proves it can say the opposite: `--self-test` drops the declarations
      # (rule 1) and plants one for an under-limit method (rule 2), and fails if either stays green.
      - name: jit gate — self-test
        if: ${{ !cancelled() }}
        run: v3/jit-gate.sh --self-test
      - name: jit gate — method sizes and the specializer
        if: ${{ !cancelled() }}
        run: v3/jit-gate.sh

      # SELF-TEST FIRST, same reasoning as the jit gate above. This one asserts that every pattern
      # reaching `Parser.regex` is inside the subset `std/parsing/regex.ssc` implements — a claim
      # whose failure mode is silence, because an unsupported pattern refuses at RUN time, in
      # somebody's parser, not here. So the run that asserts it also proves it can say the
      # opposite: the self-test feeds it an alternation and fails if that comes back green, and
      # feeds it a tree with no patterns at all and fails if an empty extraction reads as a pass.
      #
      # The gate runs on `v3/ssc3`, not `bin/ssc`: no job in this workflow builds the launcher, so
      # a gate needing it would be red here for a missing binary rather than for a real finding.
      - name: regex subset — self-test
        if: ${{ !cancelled() }}
        run: v3/regex-subset-gate.sh --self-test
      - name: regex subset — every Parser.regex pattern is inside it
        if: ${{ !cancelled() }}
        run: v3/regex-subset-gate.sh

  front-capability:
    name: the two fronts accept the same programs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # BOTH jobs need coursier, and I added it to only one — which is why this job then failed
      # 0.02 s in with "only these fronts are registered: none": `v3/ssc3` could not fetch the
      # compiler, and the gate reads that through 2>/dev/null. Duplicated rather than factored into
      # a composite action: two steps of copy beats a second file to keep in sync, and the comment
      # is here so the next person adding a job to this workflow sees both are required.
      - name: Setup coursier
        run: |
          set -euo pipefail
          if ! command -v cs >/dev/null 2>&1; then
            curl -fL "https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz" \
              | gzip -d > "$RUNNER_TEMP/cs"
            chmod +x "$RUNNER_TEMP/cs"
            sudo mv "$RUNNER_TEMP/cs" /usr/local/bin/cs
          fi
          cs --version

      # `v3/uniml-classpath.sh` builds an sbt project, and the runner does not ship sbt — the same
      # omission as the missing coursier above, in the other job. `ci.yml` uses this exact action.
      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      # SEPARATE JOB because this one costs an sbt build. UniML is an sbt project and v3's kernel is
      # not; the second front is available only when its classpath file exists. Without this step the
      # gate reports that it cannot run and exits 1 on CI — deliberately, since a capability
      # comparison with one front is not a comparison, and saying nothing is the failure this gate
      # was written about.
      - name: Register the UniML front
        run: v3/uniml-classpath.sh

      # LOUD AND FIRST, because the silent version already cost a red run and an archaeology
      # session. Since 46bccf742 the fleet is ON by default, so the driver builds `plugins.cp`
      # on first use with output DISCARDED (`fleet_cp`'s contract: a build failure must not stop
      # `ssc3 run`). On 2026-08-18 CI's sbt exported something that was not a classpath, the
      # driver's compile of `v3/plugins` failed with 75 `Not found: ssc` errors it never showed,
      # and the fallback unregistered the UNIML FRONT — so the visible symptom was
      # `front-capability-gate: CANNOT RUN`, two layers from the cause. Building here makes the
      # failure name itself (plugin-classpath.sh now validates every exported entry exists), and
      # a fleet that cannot build fails THIS step instead of silently shrinking what the gates
      # measure — it is the default users get, so CI must measure it or say loudly that it cannot.
      - name: Build the plugin fleet
        run: v3/plugin-classpath.sh

      # THE THIRD CLASSPATH, and it was the missing one. `v3/.jars/` holds three per-checkout files
      # and this workflow built two of them. Without `jvm.cp` an import of a JVM PACKAGE has nothing
      # to resolve against, so v3 falls back — correctly — to treating it as a FILE import and
      # refuses with four candidate paths to a file that cannot exist. `jvm-package-import` was red
      # in `executor differential`, `front` and `front differential` on every run since the fixture
      # landed (dff03be59), and green in every checkout where a person had ever run this script.
      # That is the same shape as the `uniml.cp` entry: a gate whose colour depends on the CHECKOUT
      # rather than on the code. Costs one sbt export, beside the two already here.
      - name: Register the importable JVM packages
        run: v3/jvm-classpath.sh

      - name: Front capability parity
        run: v3/front-capability-gate.sh
