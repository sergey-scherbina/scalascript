name: Report a problem with ScalaScript
description: Something you ran did not do what you expected. You do not need the repository.
title: "[report] "
labels: ["user-report"]
body:
  - type: markdown
    attributes:
      value: |
        **Only the first box is required.** Everything else helps and none of it blocks you: a
        partial report is worth a great deal, and a report you could not file is worth nothing.
        Send what you have.

        **Tell us what you worked out — including where you think the bug is.** If you bisected,
        read the source, or found a workaround, that is real work and we want it. It is recorded as
        YOUR finding and we reach our own conclusion separately, so a guess that turns out wrong
        costs you nothing and an accurate one saves us hours.

  - type: input
    id: summary
    attributes:
      label: One line — what went wrong
      placeholder: "for-comprehension over a Map prints nothing since 1.72"
    validations:
      required: true

  - type: input
    id: ssc-version
    attributes:
      label: ScalaScript version
      description: "`ssc --version`. If that does not work or you do not know, say so — that is information too."
      placeholder: "1.72.0   ·   or: unknown"
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: The program, and the command you ran
      description: >
        As small as you can make it — but do not hold the report back in order to minimise it. A case
        that is already minimal usually skips the reproduction step entirely, which is the single
        biggest saving there is; a case that is not still beats no case.
      render: scala
      placeholder: |
        // app.ssc
        def main() =
          for (k, v) <- Map("a" -> 1) do println(k)

        $ ssc run app.ssc
    validations:
      required: false

  - type: textarea
    id: expected-actual
    attributes:
      label: What you expected, and what happened
      description: The exact output or error if you have it, rather than a paraphrase.
      placeholder: |
        expected: prints `a`
        actual:   prints nothing, exits 0
    validations:
      required: false

  - type: textarea
    id: diagnosis
    attributes:
      label: What you think is going on — your diagnosis (optional, and genuinely wanted)
      description: >
        Your reading of the cause, a file or function you suspect, a related bug, a theory you could
        not confirm. This does not decide where we look: `POLICY.md` P-3.3 forbids routing on a
        guess, and that rule exists because guessing once put four entries under the wrong owner. So
        say it freely — it is kept as your hypothesis, it is read, and it cannot misfile anything.
      placeholder: |
        Looks like the desugaring of `for (k, v) <- …` over a Map rather than a List — a List works.
        I suspect the tuple pattern is not destructured for Map entries.
    validations:
      required: false

  - type: textarea
    id: tried
    attributes:
      label: What you already tried (optional)
      description: >
        Workarounds that worked, workarounds that did not, other spellings, other lanes
        (`ssc run-js`, `ssc run-jvm`). A failed attempt is evidence: it rules something out, and
        without it we will try the same thing.
      placeholder: |
        - `for k <- m.keys do …` works
        - same failure on `ssc run-js`
        - 1.71.0 works
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Errors, stack traces, logs (optional)
      description: Paste the whole thing. Long is fine — a truncated stack trace usually loses the useful frame.
      render: shell
    validations:
      required: false

  - type: input
    id: last-good
    attributes:
      label: Did it ever work? (optional)
      description: A version where it worked turns a bug hunt into a bisect, which is a different amount of work entirely.
      placeholder: "worked on 1.71.0"
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: OS, and Node / JVM version if your lane uses one (optional)
      placeholder: "macOS 15.5 · node 20.11 · temurin 21"
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Where you ran it (optional)
      multiple: true
      options:
        - "ssc run (default lane)"
        - "ssc run-js / Node"
        - "ssc run-jvm"
        - "ssc build-jvm / a packaged jar"
        - "the v2 / native lane"
        - "not sure"
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: How much is it in your way? (optional)
      options:
        - "blocks me — I cannot do the thing at all"
        - "there is a workaround, but it is bad"
        - "annoying"
        - "just reporting it"
    validations:
      required: false

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: >
        Anything that did not fit above — context, links, a related issue, what you were building,
        why it matters to you. This box has no shape on purpose: the reports worth having most are
        often the ones a form did not anticipate.
    validations:
      required: false
