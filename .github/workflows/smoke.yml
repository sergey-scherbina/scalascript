# The per-push verdict.
#
# WHY THIS WORKFLOW EXISTS. `ci.yml` was the push path and it could not give a verdict on most
# commits. MEASURED over the last runs that reached completion at all: 13.4 min wall clock and
# ~64 runner-minutes per push, against a `main` push interval of ~3-7 min. GitHub keeps one pending
# run per concurrency group, so of the last 100 `ci.yml` runs: 83 cancelled, 4 failure, 0 success —
# and `cancelled` reads as RED (MILESTONES.md), so the apparatus was manufacturing reds for commits
# that were fine. The `sbt` job had already been moved off push for the same arithmetic on
# 2026-07-28 (a 28:1 ratio, BUGS.md `ci-sbt-job-is-28x-the-code-push-interval`); this finishes that
# move for the conformance jobs.
#
# The suite it runs is `scripts/smoke-ci`, the SAME runner and the same checks that the local
# pre-push hook runs. That symmetry is the point: what GitHub says about a push is what the machine
# that made it already said.
#
# WHAT THIS COSTS, stated plainly rather than buried. A push no longer carries the full 363-case
# corpus, the examples-on-three-backends pass, or the launcher smokes. Those move to `ci.yml` on the
# schedule and to `scripts/full-ci` on demand. A regression outside the smoke slice now surfaces in
# the next scheduled batch, with attribution across the intervening commits. That is the trade the
# arithmetic forces; the alternative on offer was not "full coverage per push" but "no verdict at
# all", which is what was actually happening.
name: Smoke

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# NO CONCURRENCY GROUP. Every push gets its own run and reaches a verdict.
#
# This file has now held all three positions, and each was right for the job it had at the time:
#
#   cancel-in-progress: true   the first cut. WRONG: the first four runs were all `cancelled`,
#                              0 verdicts, because a sibling agent pushed inside the job's ~11 min
#                              every time. `true` completes a run only if no push lands for the whole
#                              job, and with several parallel agents that gap does not occur.
#   cancel-in-progress: false  a started run is never killed, so it finishes; GitHub replaces the
#                              PENDING one instead. MEASURED over 20 runs: 7 success, 12 cancelled —
#                              37 % of commits got a verdict. Better than the 0 in 100 it replaced,
#                              and still not what a per-push gate is for.
#   no group at all            this. MEASURED cadence on `main`: 57 commits/hour, 32 of them
#                              `[skip ci]`, so ~25 runs created per hour against a job that completes
#                              ~7. The queue was never the bottleneck — the single slot was.
#
# WHY THIS IS SAFE NOW AND WAS NOT BEFORE. `ci.yml` needs its group: it is 4+ jobs of 13-38 min, and
# 16 simultaneous runs put ~64 concurrent jobs against the account budget, which is what made every
# run queue for hours and then get evicted (BUGS ci-runs-cancelled-under-churn). `smoke.yml` is ONE
# job of ~6 min, and on a launcher-cache hit it skips sbt entirely. The load it can generate is an
# order of magnitude smaller.
#
# THE COST, stated plainly because it is the owner's money: ~25 runs/hour x ~6 min is roughly
# 150 runner-minutes/hour, against ~45 before. Triple. It buys a verdict on essentially every commit
# instead of one in three, which is the whole point of a per-push gate — a gate that answers about
# 37 % of commits still leaves the other 63 % as "unverified" in every release claim.
#
# WHAT TO WATCH, and what it would mean: if smoke runs start sitting in `queued` for minutes, the
# account's concurrent-job budget has become the limit again and the trade has stopped paying. That
# is the signal to put a group back — with `cancel-in-progress: false`, which is the measured
# second-best above — not to raise any timeout.

jobs:
  smoke:
    name: smoke — the fast repo-wide suite
    runs-on: ubuntu-latest
    # MEASURED on the first run (30543331480, cold caches): 10.8 min end to end — ~4 min of setup and
    # launcher build, then 6.3 min of suite. The suite's own budget is 420 s (SSC_SMOKE_BUDGET) and it
    # FAILS when it overruns — which it has done twice, both times with every check green: 378.5 s
    # against a 300 s guess, then 338.6 s against a 330 s cap fitted to one observation. See the
    # table in scripts/smoke-ci.ssc; the short version is that the corpus slice varies ±25 % between
    # runs on a shared runner, so a cap has to sit above the spread or it flaps. This cap is only the outer guard around the whole job. If it starts
    # being approached, read the per-check timings the runner prints — do not raise it. Raising a cap
    # instead of reading the growth is exactly how `corpus-contract.yml` went 13 runs with zero green.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MEASURED on the first green run (30545125102): the job was 9.4 min, of which the SUITE was
      # 4.2 min and setup + `install.sh --dev` was ~5.2 min. The build is the larger half and most of
      # the time it rebuilds a byte-identical toolchain: measured 2026-07-28, 43 of 58 run-creating
      # commits in one hour touched only `.md` or `.work/`, none of which can reach a staged jar.
      #
      # The digest is a content hash of everything that CAN reach it. Its path list is an EXCLUSION
      # list, and scripts/launcher-input-digest explains at length why: an inclusion list that misses
      # one compiler source restores the previous commit's toolchain from cache, runs the whole suite
      # with it, and reports GREEN about code it never executed — with no symptom at all.
      - name: Launcher input digest
        id: launcher
        run: |
          digest="$(scripts/launcher-input-digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "launcher inputs: $digest"

      # NO `restore-keys`, and that is the point. A prefix fallback would happily restore a toolchain
      # built from DIFFERENT inputs, which is precisely the stale-launcher failure above. Exact key
      # or miss.
      - name: Restore staged toolchain
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: bin
          key: ${{ runner.os }}-toolchain-v1-${{ steps.launcher.outputs.digest }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Scala CLI
        uses: VirtusLab/scala-cli-setup@v1
        with:
          power: true
          jvm: temurin:21

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # sbt and its caches are only needed to BUILD. On a hit they are pure setup cost for a step
      # that will not run.
      - name: Setup sbt
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: sbt/setup-sbt@v1

      - name: Cache Coursier/sbt
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      # RESTORE-ONLY, with the save at the end gated on success. The old unified cache re-saved even
      # when the build FAILED, so one partial build poisoned zinc for 200+ red runs (see the same
      # note in ci.yml). Per-job prefix `-v2-smoke-`, disjoint from `-v2-conf-` and `-v2-sbt-`: those
      # jobs compile with different sbt invocations, so their zinc analyses are not interchangeable
      # and sharing a cache re-creates the poison.
      - name: Restore compiled classes (zinc)
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            **/target/scala-*/classes
            **/target/scala-*/test-classes
            **/target/scala-*/zinc
            **/target/streams
          key: ${{ runner.os }}-classes-v2-smoke-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-classes-v2-smoke-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-

      # The runner is a `.ssc` program executing on the v2 native lane, so the launcher is not an
      # optimisation here — it is the interpreter of the suite.
      - name: Build ssc launcher (sbt-assembly)
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: bash install.sh --dev

      # `/bin/` is gitignored but `bin/ssc` is TRACKED, so a restored cache writes over a tracked
      # file. On a correct hit it is byte-identical (the launcher template lives in build.sbt, which
      # is an included input, so a changed template means a changed digest means a miss) — but
      # "should be identical" is the kind of assumption that is worth one `git status`.
      - name: Verify the restored toolchain left the tree clean
        if: steps.toolchain.outputs.cache-hit == 'true'
        run: |
          if [[ -n "$(git status --porcelain bin)" ]]; then
            echo "The restored toolchain differs from the tracked bin/ files:" >&2
            git status --porcelain bin >&2
            echo "A cache entry keyed on the launcher inputs should not be able to do this." >&2
            exit 1
          fi
          echo "restored toolchain matches the tracked bin/ files"

      # Save on a MISS only. On a hit the entry already exists under this exact key, and re-uploading
      # ~180 MB to overwrite it with itself is pure cost. Gated on success so a build that died
      # half-way can never publish a partial staging under a key that claims to be complete — the
      # same rule the zinc cache below learned the hard way (200+ red runs from one poisoned entry).
      #
      # DELIBERATELY BEFORE the suite runs, which looks like a violation of that rule and is not. The
      # rule is "never cache a failed BUILD"; `success()` here means every step up to and including
      # `install.sh --dev` passed, so the staging is complete. The suite that follows tests the
      # REPOSITORY, not the staging — a red gate says nothing about whether these jars are the right
      # jars. Saving after the suite would throw away a perfectly good toolchain because an unrelated
      # check went red, and make the next run pay 3.5 min to rebuild the identical bytes.
      - name: Save staged toolchain
        if: success() && steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: bin
          key: ${{ runner.os }}-toolchain-v1-${{ steps.launcher.outputs.digest }}

      - name: Run the smoke suite
        run: scripts/smoke-ci

      - name: Save compiled classes (zinc)
        if: success() && steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            **/target/scala-*/classes
            **/target/scala-*/test-classes
            **/target/scala-*/zinc
            **/target/streams
          key: ${{ runner.os }}-classes-v2-smoke-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-${{ github.sha }}
