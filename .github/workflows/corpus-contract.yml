name: Corpus Contract

# The always-on differential gate (tests/conformance/contract.sc): both corpora
# × lanes {int, js, v2} diffed against the golden, compared to corpus-baseline.tsv.
# Runs nightly + on demand rather than per-PR. It is RED on any regression or on a
# closed gap that wasn't recorded in the baseline. See tests/conformance/CONTRACT.md.
#
# SHARDED since 2026-07-27 (corpus-contract-shard-fix), and here is why — the header
# used to say "~415 cases × 3 lanes … ~25 min" and that estimate went stale silently:
# by 2026-07-27 the corpus was 485 cases and per-case cost had grown (F is the default
# native front since 56d7d705f and is 2-4× slower), so a full pass needed ~95-100 min
# against a 60-min budget. Result: 13 runs, ZERO green — 3 `failure` then 10 killed at
# the wall. A job timeout surfaces as `cancelled`, NOT `failure`, so it read as benign
# and the whole F4 front-flip landed without its differential net.
#   ⇒ If you ever see this workflow `cancelled`, treat it as RED, not as "someone
#     cancelled it" — and re-check the per-shard budget below rather than raising the
#     timeout, which is what hid the growth last time.
# 4 round-robin shards ≈ 6 min setup + ~24 min cases each; the 60-min guard stays as a
# guard, not as the operating point.
#
# TODO: add memo (F2) + batch lanes (F4) like run.sc, then promote to a per-PR gate.

on:
  schedule:
    - cron: '0 4 * * *'   # nightly, 04:00 UTC
  workflow_dispatch: {}

jobs:
  contract:
    name: Corpus Contract shard ${{ matrix.shard }}/4 (int/js/v2 differential)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Round-robin shards (idx % 4), not contiguous blocks — the corpus is name-sorted
    # and the slow cases cluster by name. fail-fast: false so one red shard still lets
    # the others report; a partial verdict is what made the timeout unreadable.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Scala CLI
        uses: VirtusLab/scala-cli-setup@v1
        with:
          power: true
          jvm: temurin:21

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Cache Coursier/sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      # Distinct cache prefix (…-v2-contract-) from the conformance/sbt jobs: their
      # zinc analyses are built with different sbt invocations and are not
      # interchangeable (sharing re-creates the crypto-spi "not a member" poison).
      - name: Restore compiled classes (zinc)
        uses: actions/cache/restore@v4
        with:
          path: |
            **/target/scala-*/classes
            **/target/scala-*/test-classes
            **/target/scala-*/zinc
            **/target/streams
          key: ${{ runner.os }}-classes-v2-contract-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-classes-v2-contract-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-

      - name: Build ssc launcher (sbt-assembly)
        run: bash install.sh --dev

      - name: Run corpus contract (shard ${{ matrix.shard }}/4)
        run: scala-cli tests/conformance/contract.sc --shard ${{ matrix.shard }}/4
