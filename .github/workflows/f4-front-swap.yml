name: F4 Front Swap Gates

# The F4 cutover ratchet: is the self-hosting front F (specs/v2.2-p6.5-fsub.ssc) ready to replace the
# untyped ssc1-front+ssc1-lower as v2's native tier? Two complementary gates (specs/v2-language-surface.md §7):
#   * classify — output-equivalence of run-ir(F(P)) vs the untyped oracle over the whole corpus+tower,
#                bucketed MATCH / oracle-excluded / GAP·OUT·DEFERRED (manifest) / genuine-FAIL.
#   * dualrun  — the FAITHFUL production path: bin/ssc run P (default front) vs SSC_FRONT=F bin/ssc run P,
#                plus the typed self-compile fixpoint (byte-identical).
# GREEN = no UNEXPECTED disagreement / divergence. This must be green BEFORE Sergiy flips the installBin
# default (the irreversible step 4). Runs nightly + on demand (not per-PR): the gates re-compile F per
# program, so a full sweep is slow — it is a pre-flip ratchet, not an every-commit check.

on:
  schedule:
    - cron: '30 4 * * *'   # nightly, 04:30 UTC (after Corpus Contract at 04:00)
  workflow_dispatch:
    inputs:
      full_corpus:
        description: 'dual-run the FULL corpus (SSC_DUALRUN_ALL=1) instead of the fast slice'
        type: boolean
        default: false

jobs:
  f4-gates:
    name: F4 classify + dual-run
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Scala CLI
        uses: VirtusLab/scala-cli-setup@v1
        with:
          power: true
          jvm: temurin:21

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Cache Coursier/sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      # coreutils gives GNU timeout(1) — the gates bound each per-program run so a pathological
      # program cannot hang the sweep.
      - name: Ensure timeout(1)
        run: timeout --version >/dev/null 2>&1 || sudo apt-get update && sudo apt-get install -y coreutils

      # Stages bin/ssc + bin/lib/** (installBin) so BOTH fronts run through the real launcher.
      - name: Build ssc launcher (installBin)
        run: bash install.sh --dev

      # The run-ir-capable v2 kernel jar the gates drive directly.
      - name: Package v2 kernel jar
        run: scala-cli --power package v2/src --assembly -o /tmp/ssc-f4.jar --force

      # WIRED 2026-08-13, having been invoked by nothing since it was written — one of three orphans
      # `no-orphan-gates` could not see while it counted a comment as a caller (b97c36f2e), and named
      # in a `gate:` field on the v2 board, so that entry claimed coverage from a script nobody ran.
      #
      # IT BELONGS HERE RATHER THAN IN ci.yml, for two reasons that point the same way. The jar is
      # already built one step above, so the gate costs ~2 s instead of the ~4-minute assembly it
      # does for itself when `SSC_JAR` is unset. And the subject is this workflow's own premise: these
      # gates compare F against the untyped legacy ORACLE, and this asserts the oracle still lowers an
      # annotation on its own line — a broken oracle makes every comparison above meaningless.
      # Deliberately NOT on the push path.
      #
      # `--self-test` first: it proves the probe can fail (a malformed program must produce `_err`)
      # before the real checks run, which matters because the whole assertion is the ABSENCE of a
      # sentinel — the state a probe that looks at nothing also reports.
      - name: Legacy front lowers an own-line annotation
        run: SSC_JAR=/tmp/ssc-f4.jar tests/e2e/ssc1-front-annotation.sh --self-test

      # The classify gate's REPORTING, checked before the gate itself runs — on a synthetic
      # classification, in ~0 s, needing neither the jar nor the corpus. It asserts what the gate
      # reports about the programs it DROPS: 58 % of the corpus is excluded before F is consulted,
      # and until 2026-08-13 the report carried a count and not one name, so a program could leave
      # the compared set and read as a pass. Runs first because a run whose report is broken is
      # worth less than no run.
      - name: Classify reporting names what it dropped
        run: bash specs/v2.2-p6.5-semantic.sh self-test

      - name: Classify gate (output-equivalence, self-maintaining)
        run: SSC_JAR=/tmp/ssc-f4.jar V2_DIR="$PWD/v2" bash specs/v2.2-p6.5-semantic.sh classify

      - name: Dual-run gate (default front vs SSC_FRONT=F + fixpoint)
        run: |
          if [ "${{ github.event.inputs.full_corpus }}" = "true" ]; then export SSC_DUALRUN_ALL=1; fi
          SSC_JAR=/tmp/ssc-f4.jar V2_DIR="$PWD/v2" bash specs/v2.2-p6.5-dualrun.sh
