name: Native Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualifier-contract:
    name: Prove compare-first release refusals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run controlled archive mutations
        run: tests/e2e/native-release-qualification.sh

      - name: Run controlled publication mutations
        run: tests/e2e/native-release-publication.sh

  native-image:
    name: Qualify ${{ matrix.artifact_id }} on ${{ matrix.runner }}
    needs: qualifier-contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # native_image_xmx: the image builder prints its own requirement
          # (>6.04 GB on ubuntu, >5.69 GB on intel) and the runners differ
          # widely, so one figure cannot fit all three. arm64 has only 7 GB
          # TOTAL — 6g leaves the OS ~1 GB and is the ceiling here, not a
          # comfortable value. If it still starves, that runner is too small
          # for this image and needs a larger one.
          - runner: ubuntu-latest
            artifact_id: ssc-linux-x86_64
            native_image_xmx: 10g
          - runner: macos-latest
            artifact_id: ssc-macos-arm64
            native_image_xmx: 6g
          - runner: macos-15-intel
            artifact_id: ssc-macos-x86_64
            native_image_xmx: 9g

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # PINNED. `java-version: '21'` floats to the newest 21.0.x, which is the one
      # unpinned input in a file where every action is pinned by SHA -- so the
      # toolchain that builds a release could differ between two runs of the same
      # tag. It already mattered: the arm64 runner failed inside native-image with
      #   Image heap writing found a class not seen during static analysis
      #   root: LocaleData$LocaleDataStrategy.getCandidateLocales
      # on the 21.0.9 that '21' resolved to, while the same commit, same arch
      # (arm64), same distribution (Oracle GraalVM) and same heap (6g) builds
      # clean locally on 21.0.11 in 2m18s. Distribution, architecture and heap are
      # therefore ruled OUT as the cause by measurement; the patch version is the
      # remaining suspect (the other being the runner's 7 GB of RAM against 36 GB
      # locally). Pinning is correct on its own merits and doubles as the test.
      # tests/BUGS.md native-release-native-image-three-defects.
      - name: Setup GraalVM 21
        uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1
        with:
          java-version: '21.0.11'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup sbt
        uses: sbt/setup-sbt@f6db8ab474efba716fc7f04441ab33714e4825af # v1

      - name: Build native binary, frontend data, and plugin host
        env:
          SSC_NATIVE_IMAGE_XMX: ${{ matrix.native_image_xmx }}
        run: |
          # The `set cli / graalVMNativeImageOptions := ...` line that used to be
          # here rewrote the reflection/resource config paths and forced
          # -J-Xmx5g. Its comment called it a temporary diagnostic kept "while
          # build.sbt is owned by a different live claim"; in fact it was load
          # bearing, because build.sbt's own paths resolved to a directory that
          # does not exist. build.sbt is fixed now (anchored on the build root)
          # and takes the heap from SSC_NATIVE_IMAGE_XMX above, so the override
          # is gone rather than merely trimmed.
          sbt \
            "cli/installBin" \
            "cli/graalvm-native-image:packageBin" \
            "pluginHost/assembly"

      - name: Assemble release payload
        env:
          ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p dist/archive/lib dist/archive/bin/lib/standard

          native_binary=v1/tools/cli/target/graalvm-native-image/scalascript-cli
          test -x "$native_binary"
          cp "$native_binary" "dist/$ARTIFACT_ID"
          chmod +x "dist/$ARTIFACT_ID"
          cp "dist/$ARTIFACT_ID" dist/archive/ssc

          shopt -s nullglob
          plugin_hosts=(v1/tools/plugin-host/target/scala-*/ssc-plugin-host.jar)
          if [[ ${#plugin_hosts[@]} -ne 1 ]]; then
            printf 'plugin-host collection: expected=1 actual=%s paths=%s\n' \
              "${#plugin_hosts[@]}" "${plugin_hosts[*]:-<none>}" >&2
            exit 1
          fi
          cp "${plugin_hosts[0]}" dist/archive/lib/ssc-plugin-host.jar
          test -s dist/archive/lib/ssc-plugin-host.jar

          test -d bin/lib/standard/native-front
          cp -R bin/lib/standard/native-front \
            dist/archive/bin/lib/standard/native-front
          cp README.md dist/archive/README.md

      - name: Manifest and compress release payload
        env:
          ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          set -euo pipefail
          front=dist/archive/bin/lib/standard/native-front
          python3 - "$front" <<'PY'
          import hashlib
          import os
          import sys

          root = os.path.realpath(sys.argv[1])
          manifest = os.path.join(root, "MANIFEST.sha256")
          if os.path.lexists(manifest):
              os.remove(manifest)

          paths = []
          for directory, directories, files in os.walk(root):
              directories.sort()
              files.sort()
              for name in files:
                  absolute = os.path.join(directory, name)
                  if os.path.islink(absolute):
                      raise SystemExit(f"native-front manifest refuses symlink: {absolute}")
                  paths.append(os.path.relpath(absolute, root).replace(os.sep, "/"))

          with open(manifest, "w", encoding="utf-8", newline="\n") as output:
              for relative in sorted(paths):
                  digest = hashlib.sha256()
                  with open(os.path.join(root, *relative.split("/")), "rb") as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                          digest.update(chunk)
                  output.write(f"{digest.hexdigest()}  {relative}\n")
          PY

          archive="dist/$ARTIFACT_ID.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C dist/archive \
            ssc lib bin README.md
          if command -v sha256sum >/dev/null 2>&1; then
            digest=$(sha256sum "$archive" | awk '{print $1}')
          else
            digest=$(shasum -a 256 "$archive" | awk '{print $1}')
          fi
          printf '%s  %s\n' "$digest" "${archive##*/}" >"$archive.sha256"

      - name: Qualify isolated shipped bytes
        env:
          ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          set -euo pipefail
          isolated="$RUNNER_TEMP/native-release-$ARTIFACT_ID"
          mkdir -p "$isolated"
          cp "dist/$ARTIFACT_ID" "$isolated/"
          cp "dist/$ARTIFACT_ID.tar.gz" "$isolated/"
          cp "dist/$ARTIFACT_ID.tar.gz.sha256" "$isolated/"
          cp scripts/native-release-qualify "$isolated/"
          chmod +x "$isolated/$ARTIFACT_ID" "$isolated/native-release-qualify"

          # A native image with a captured checkout root must fail here. Hide
          # both current and legacy staged frontend layouts before execution.
          mv bin/lib/standard/native-front \
            "$RUNNER_TEMP/hidden-standard-native-front"
          mv bin/lib/native-front \
            "$RUNNER_TEMP/hidden-legacy-native-front"

          cd "$isolated"
          ./native-release-qualify "$ARTIFACT_ID" "$ARTIFACT_ID.tar.gz"

      - name: Upload qualified native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_id }}
          path: |
            dist/${{ matrix.artifact_id }}
            dist/${{ matrix.artifact_id }}.tar.gz
            dist/${{ matrix.artifact_id }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish qualified tag
    needs: native-image
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout versioned publication contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download qualified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ssc-*
          path: dist
          merge-multiple: true

      - name: Validate and publish fresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_PROMPT_DISABLED: '1'
        run: |
          scripts/native-release-publish "$GITHUB_REF_NAME" dist
