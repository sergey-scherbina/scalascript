# ScalaScript 3 — its gates, run by something other than a person remembering to.
#
# WHY THIS FILE EXISTS. Measured 2026-08-08: `v3` appears in NO workflow, in no script under
# `scripts/`, and not in `scripts/smoke-ci.ssc`. Every one of v3's gates — selftest, exec, bridge,
# parity, front, front-report — is run by hand, and they are good gates: they caught a parser change
# that silently dropped two statements the same day they were run.
#
# That is the second suite found unwired this week; the first was `@scalascript/control-direct`,
# whose 496 lines of tests nothing invoked for three weeks while eleven BUGS entries sat open
# waiting for a signal they could never receive. A suite nobody runs is worse than a red one: a red
# suite at least says something.
#
# Its own file rather than a job in ci.yml, for the same reason js-packages.yml has one: the
# push-path budget should not be the reason a suite stays unwired, and these gates need none of
# that suite's setup.
name: v3

on:
  push:
    branches: [main]
    paths:
      - 'v3/**'
      - '.github/workflows/v3.yml'
  pull_request:
    paths:
      - 'v3/**'
      - '.github/workflows/v3.yml'
  workflow_dispatch:

concurrency:
  group: v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: v3 gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # `v3/ssc3` fetches the Scala compiler with coursier, so `cs` has to be here. Mirrors the
      # Linux branch of the repository's own `setup.sh`, which is where a developer gets it —
      # `v3/SPRINT.md` item 31e records why it became a first-class requirement: scala-cli used to
      # bundle a copy, and v3 stopped going through scala-cli.
      #
      # THIS STEP IS WHY THE JOB WAS RED ON ALL TEN OF ITS RUNS, from the commit that introduced it.
      # The comment that stood here said "the kernel builds with the JDK and nothing else —
      # invariant I-1 — so nothing is installed for these", and that is a MISREADING of I-1.
      # `00-charter.md` defines I-1 as an empty `libraryDependencies` and no kernel import outside
      # `java.*`/`scala.*` — a property of the ARTIFACT. It says nothing about build tooling, and it
      # cannot: the kernel is written in Scala, so compiling it needs a Scala compiler no matter how
      # dependency-free the result is. Installing `cs` does not weaken I-1; the gate for I-1 is the
      # dependency-list check named in the charter, not the absence of a setup step here.
      - name: Setup coursier
        run: |
          set -euo pipefail
          if ! command -v cs >/dev/null 2>&1; then
            curl -fL "https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz" \
              | gzip -d > "$RUNNER_TEMP/cs"
            chmod +x "$RUNNER_TEMP/cs"
            sudo mv "$RUNNER_TEMP/cs" /usr/local/bin/cs
          fi
          cs --version

      # THIS JOB NEEDS THE UNIML FRONT, and not registering it is why it had never been green:
      # 48 runs listed on 2026-08-09, 0 successes, back to at least 2026-08-08. `exec-gate.sh` and
      # `front-gate.sh` both carry `.uniml-only` fixtures — programs v3's own parser refuses — and
      # both go RED rather than skip when the front is absent, deliberately, because a gate that
      # goes green with fixtures unrun reports less than it claims. On CI it was always absent.
      #
      # The step existed, in the OTHER job, with a comment reading "SEPARATE JOB because this one
      # costs an sbt build". That reasoning was never priced: measured on run 31321407887, the step
      # takes 0.8 min against a `gates` job that died at 2.2. The saving was not a saving — it was
      # paid for with a job that could not pass, and with every step below this one skipped on every
      # run since it was written.
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Register the UniML front
        run: v3/uniml-classpath.sh

      # `if: !cancelled()` ON EVERY GATE, and it is the second half of the same defect. A step that
      # fails stops the job, so ONE red gate hid the other five — `bridge`, `parity`, `front`,
      # `front report` and both jit steps reported nothing at all while `executor differential` was
      # red, and nobody could see whether they would have passed. The job is still red if any gate
      # is red; what changes is that all of them now say so. `!cancelled()` rather than `always()`
      # so a cancelled run (this workflow has `cancel-in-progress: true`) stops promptly instead of
      # grinding through six gates nobody is waiting for.
      #
      # The driver caches a jar per SOURCE DIGEST, which is why the first gate pays for the compile
      # and the rest do not.
      - name: selftest
        run: v3/selftest.sh
      - name: executor differential
        if: ${{ !cancelled() }}
        run: v3/exec-gate.sh
      - name: bridge
        if: ${{ !cancelled() }}
        run: v3/bridge-gate.sh
      - name: parity
        if: ${{ !cancelled() }}
        run: v3/parity-gate.sh
      - name: front
        if: ${{ !cancelled() }}
        run: v3/front-gate.sh
      - name: front report
        if: ${{ !cancelled() }}
        run: v3/front-report-gate.sh

      # THE SELF-TEST RUNS FIRST, and that ordering is the point. This gate's green means "no method
      # is over the JVM's compile limit except the ones declared" — a claim nothing else in CI can
      # contradict, because a program whose methods are too big to compile is still CORRECT. So the
      # run that asserts it also proves it can say the opposite: `--self-test` drops the declarations
      # (rule 1) and plants one for an under-limit method (rule 2), and fails if either stays green.
      - name: jit gate — self-test
        if: ${{ !cancelled() }}
        run: v3/jit-gate.sh --self-test
      - name: jit gate — method sizes and the specializer
        if: ${{ !cancelled() }}
        run: v3/jit-gate.sh

  front-capability:
    name: the two fronts accept the same programs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # BOTH jobs need coursier, and I added it to only one — which is why this job then failed
      # 0.02 s in with "only these fronts are registered: none": `v3/ssc3` could not fetch the
      # compiler, and the gate reads that through 2>/dev/null. Duplicated rather than factored into
      # a composite action: two steps of copy beats a second file to keep in sync, and the comment
      # is here so the next person adding a job to this workflow sees both are required.
      - name: Setup coursier
        run: |
          set -euo pipefail
          if ! command -v cs >/dev/null 2>&1; then
            curl -fL "https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz" \
              | gzip -d > "$RUNNER_TEMP/cs"
            chmod +x "$RUNNER_TEMP/cs"
            sudo mv "$RUNNER_TEMP/cs" /usr/local/bin/cs
          fi
          cs --version

      # `v3/uniml-classpath.sh` builds an sbt project, and the runner does not ship sbt — the same
      # omission as the missing coursier above, in the other job. `ci.yml` uses this exact action.
      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      # SEPARATE JOB because this one costs an sbt build. UniML is an sbt project and v3's kernel is
      # not; the second front is available only when its classpath file exists. Without this step the
      # gate reports that it cannot run and exits 1 on CI — deliberately, since a capability
      # comparison with one front is not a comparison, and saying nothing is the failure this gate
      # was written about.
      - name: Register the UniML front
        run: v3/uniml-classpath.sh

      - name: Front capability parity
        run: v3/front-capability-gate.sh
