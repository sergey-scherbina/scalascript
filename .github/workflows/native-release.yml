name: Native Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualifier-contract:
    name: Prove compare-first release refusals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run controlled archive mutations
        run: tests/e2e/native-release-qualification.sh

      - name: Run controlled publication mutations
        run: tests/e2e/native-release-publication.sh

      # A SAFETY NET, not the primary guarantee — the primary one is that `scripts/cut-release`
      # bumps `ThisBuild / version` and creates the tag in the SAME atomic step, so the two cannot
      # drift by construction. This exists for the case that guarantee did not cover: someone
      # (or some OTHER automation) creates the tag by hand. It runs FIRST, in the job every other
      # job `needs:`, so a forgotten bump fails in seconds — not after hours of native-image builds
      # on three runners (BUGS.md `native-release-version-not-bumped-before-tag`: the v0.2.1 prep
      # for this exact release caught `ThisBuild / version` still reading a prior release's
      # -SNAPSHOT, which `ssc --version` and every `.sscpkg` manifest would have shipped verbatim).
      - name: Verify build.sbt version matches the release tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          actual=$(sed -nE 's/^ThisBuild \/ version[[:space:]]*:=[[:space:]]*"([^"]+)".*/\1/p' build.sbt | head -1)
          if [[ -z "$actual" ]]; then
            echo "could not find 'ThisBuild / version := \"...\"' in build.sbt" >&2
            exit 1
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "release version mismatch: build.sbt says '$actual', tag '$GITHUB_REF_NAME' expects '$expected'." >&2
            echo "This tag was not cut with scripts/cut-release — bump build.sbt and re-tag." >&2
            exit 1
          fi
          echo "build.sbt version ($actual) matches tag ($GITHUB_REF_NAME)"

      # The other half of the same guarantee: `scripts/cut-release` writes
      # registry/packages.yaml's version/url in the SAME commit as the build.sbt bump above, before
      # tagging — so the tag already carries the right entries and `release`'s job needs no
      # commit-to-main step to fix them up afterward. `--check` is read-only: it fails without
      # writing if the tag disagrees with what the generator would produce for it.
      - name: Verify registry plugin entries match this tag
        if: github.ref_type == 'tag'
        run: python3 scripts/generate-registry-plugin-entries "$GITHUB_REF_NAME" --check

  native-image:
    name: Qualify ${{ matrix.artifact_id }} on ${{ matrix.runner }}
    needs: qualifier-contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # native_image_xmx on arm64 is bounded from BOTH sides, measured:
          #   4g  -> the builder reports 3.56 GB usable (50.8% of 7 GB), spends
          #          13-28% of its time in GC, prints "Consider increasing the
          #          heap size", and the watchdog aborts after 52 min
          #   6g  -> does not fit the 7 GB machine at all; crawled past 71 min
          #   5g  -> builds locally in 5m58s with default threads
          # 5g was tried once on CI and failed, but that was BEFORE the sbt phase
          # became its own step, so a 2.3 GB sbt was resident beside it. This is
          # the one untried point between two known-bad ones.
          #
          # -H:NumberOfThreads is NOT a lever here and was measured rather than
          # assumed: 3 -> 2 moved peak RSS by 1.4%, and at 5g the 2-thread build
          # died with OutOfMemoryError where the 3-thread build succeeded.
          #
          # If 5g still fails, this runner is too small for this image and the
          # choice is a larger runner or shipping without the arm64 artifact --
          # not more tuning between 4 and 6.
          - runner: ubuntu-latest          # 15.61 GB
            artifact_id: ssc-linux-x86_64
            native_image_xmx: 10g
          - runner: macos-latest           # 7.00 GB — the binding constraint
            artifact_id: ssc-macos-arm64
            native_image_xmx: 5g
          - runner: macos-15-intel         # 14.00 GB
            artifact_id: ssc-macos-x86_64
            native_image_xmx: 9g

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # PINNED, and the value is 21.0.9 for a hard reason: Oracle ships no macOS
      # x64 build after it. Verified against the archive rather than assumed --
      #   21.0.9   macos-x64 200   macos-aarch64 200   linux-x64 200
      #   21.0.11  macos-x64 404   macos-aarch64 200   linux-x64 200
      #   21.0.12  macos-x64 404   macos-aarch64 200   linux-x64 200
      # so 21.0.9 is the newest version that exists on all three release targets.
      # A first attempt pinned 21.0.11, chosen because that is what was installed
      # on the arm64 machine it was tested on, and macos-15-intel then failed in
      # `Setup GraalVM` before compiling anything.
      #
      # Pinning at all is the point: `java-version: '21'` floats, and it was the
      # single unpinned input in a file where every action is pinned by SHA, so
      # one tag could be built by different toolchains on different days -- and,
      # worse, by DIFFERENT versions per platform in the same run, since '21'
      # resolves to the newest build available for each.
      # tests/BUGS.md native-release-native-image-three-defects.
      - name: Setup GraalVM 21
        uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1
        with:
          java-version: '21.0.9'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup sbt
        uses: sbt/setup-sbt@f6db8ab474efba716fc7f04441ab33714e4825af # v1

      # Dependency cache only — NOT compiled classes. ci.yml caches those too and
      # keys them by commit SHA, which is right for a CI run that wants the
      # nearest previous build. A release must not: the artifact people download
      # has to come from a compile of THIS tag, not from whatever zinc happened
      # to consider unchanged. Resolution is different — a jar is identified by
      # its coordinates, so reusing it changes nothing about what is built.
      #
      # Worth more since pipelining was turned off build-wide (that fix is what
      # made the release buildable at all): compilation got slower, so not
      # re-downloading the world on three runners is a real saving.
      - name: Cache Coursier/sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-release-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-release-sbt-

      # SPLIT INTO TWO sbt INVOCATIONS ON PURPOSE. These used to be one command,
      # which meant the sbt JVM — measured at 2306 MB peak RSS after compiling —
      # was still resident while native-image asked for its own multiple GB. On
      # the 7 GB arm64 runner that 2.3 GB is the difference between building and
      # swapping. Letting sbt exit first costs a few seconds of reloading the
      # build definition and buys back a third of that machine.
      - name: Build jars and staged layout
        env:
          # MUST be here, not on the image step: the heap flag is baked into the
          # argv when `cli/nativeImageArgv` generates it, and that happens now.
          SSC_NATIVE_IMAGE_XMX: ${{ matrix.native_image_xmx }}
        run: |
          # nativeImageArgv writes the exact command the next step runs, so sbt is
          # not alive during the image build. See that step for why.
          sbt \
            "cli/installBin" \
            "pluginHost/assembly" \
            "cli/nativeImageArgv"

      - name: Build native binary
        run: |
          # native-image is invoked DIRECTLY, with sbt already exited.
          #
          # sbt never stepped aside for this: it is the process that forks
          # native-image and stays resident for the whole build, measured at
          # ~1.7 GB. On the 7 GB arm64 runner that is decisive -- the image
          # builder needs 4.5+ GB and every heap value between 4g and 6g failed,
          # either starving (watchdog "no activity") or exceeding the machine.
          # Splitting the sbt commands into two steps did NOT fix that, and
          # capping sbt's heap did not either. Removing sbt from the step does.
          #
          # The argv comes from `cli/nativeImageArgv` in build.sbt, built out of
          # the same settings the sbt plugin uses, so the command has ONE source
          # and cannot drift from what a local `packageBin` runs.
          #
          # python3 rather than bash: the file is NUL-separated (a classpath is
          # one enormous argument) and macOS runners ship bash 3.2, where
          # `mapfile -d ''` does not exist.
          # A single python3 -c rather than a heredoc. Both work here (the manifest
          # step below uses a heredoc), this one just has no terminator to align.
          python3 -c 'import os,sys; f="v1/tools/cli/target/native-image-argv"; a=open(f,"rb").read().decode("utf-8").split(chr(0)); d=os.path.join(os.path.dirname(f),"graalvm-native-image"); os.makedirs(d,exist_ok=True); os.chdir(d); print("exec %s (%d args) in %s" % (a[0],len(a),d), flush=True); os.execvp(a[0],a)'

      - name: Assemble release payload
        env:
          ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p dist/archive/lib

          native_binary=v1/tools/cli/target/graalvm-native-image/scalascript-cli
          test -x "$native_binary"
          cp "$native_binary" dist/archive/ssc
          chmod +x dist/archive/ssc

          shopt -s nullglob
          plugin_hosts=(v1/tools/plugin-host/target/scala-*/ssc-plugin-host.jar)
          if [[ ${#plugin_hosts[@]} -ne 1 ]]; then
            printf 'plugin-host collection: expected=1 actual=%s paths=%s\n' \
              "${#plugin_hosts[@]}" "${plugin_hosts[*]:-<none>}" >&2
            exit 1
          fi
          cp "${plugin_hosts[0]}" dist/archive/lib/ssc-plugin-host.jar
          test -s dist/archive/lib/ssc-plugin-host.jar

          # The checkout's own bin/lib/tower (no tier prefix, no "native-front" name — specs/
          # arch-lib-path-resolution.md §7, §9) is copied straight into the archive's lib/, so
          # ssc.lib.path discovery (NativeImageInstallRoot) finds a plain lib/ beside the binary
          # with no forced bin/ nesting.
          test -d bin/lib/tower
          cp -R bin/lib/tower dist/archive/lib/tower

          # std/ ships as its own top-level lib/std/ — a single copy, not nested under
          # tower/ and not duplicated per tier (specs/arch-lib-path-resolution.md §6).
          test -d bin/lib/std
          cp -R bin/lib/std dist/archive/lib/std

          cp README.md dist/archive/README.md

      - name: Manifest and compress release payload
        env:
          ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          set -euo pipefail
          front=dist/archive/lib/tower
          std=dist/archive/lib/std
          python3 - "$front" "$std" <<'PY'
          import hashlib
          import os
          import sys

          def manifest_one(root):
              root = os.path.realpath(root)
              manifest = os.path.join(root, "MANIFEST.sha256")
              if os.path.lexists(manifest):
                  os.remove(manifest)

              paths = []
              for directory, directories, files in os.walk(root):
                  directories.sort()
                  files.sort()
                  for name in files:
                      absolute = os.path.join(directory, name)
                      if os.path.islink(absolute):
                          raise SystemExit(f"manifest refuses symlink: {absolute}")
                      paths.append(os.path.relpath(absolute, root).replace(os.sep, "/"))

              with open(manifest, "w", encoding="utf-8", newline="\n") as output:
                  for relative in sorted(paths):
                      digest = hashlib.sha256()
                      with open(os.path.join(root, *relative.split("/")), "rb") as stream:
                          for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                              digest.update(chunk)
                      output.write(f"{digest.hexdigest()}  {relative}\n")

          for root in sys.argv[1:]:
              manifest_one(root)
          PY

          archive="dist/$ARTIFACT_ID.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C dist/archive \
            ssc lib README.md
          if command -v sha256sum >/dev/null 2>&1; then
            digest=$(sha256sum "$archive" | awk '{print $1}')
          else
            digest=$(shasum -a 256 "$archive" | awk '{print $1}')
          fi
          printf '%s  %s\n' "$digest" "${archive##*/}" >"$archive.sha256"

      # macOS 15 runner images ship with the Application Firewall blocking incoming TCP even on
      # loopback (actions/runner-images#11901, #10924): the qualify script's local registry server
      # binds 127.0.0.1 and every connect is refused, with nothing in the server's own log — its
      # 'Serving HTTP' banner sits block-buffered while the firewall eats the SYNs. Both macOS
      # qualify jobs failed 'registry-server: never came up' on dispatch 33520292532 while the
      # identical check passed on ubuntu. Disabling the firewall is the documented workaround, and
      # this is a throwaway CI VM qualifying loopback-only traffic.
      - name: Allow loopback listeners (macOS 15 firewall refuses them)
        if: runner.os == 'macOS'
        run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off

      - name: Qualify isolated shipped bytes
        env:
          ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          set -euo pipefail
          isolated="$RUNNER_TEMP/native-release-$ARTIFACT_ID"
          mkdir -p "$isolated"
          cp "dist/$ARTIFACT_ID.tar.gz" "$isolated/"
          cp "dist/$ARTIFACT_ID.tar.gz.sha256" "$isolated/"
          cp scripts/native-release-qualify "$isolated/"
          # Only the qualify script needs the bit: the bare binary stopped being copied here when
          # 93bc81423 dropped it from the release, and a chmod on the no-longer-present
          # "$isolated/$ARTIFACT_ID" is what failed all three qualify jobs on the v0.3.0 tag —
          # the first run this step ever had, since qualify runs only on tags and dispatches.
          chmod +x "$isolated/native-release-qualify"

          # A native image with a captured checkout root must fail here. Hide the staged
          # frontend and std/ before execution.
          mv bin/lib/tower "$RUNNER_TEMP/hidden-tower"
          mv bin/lib/std "$RUNNER_TEMP/hidden-std"

          cd "$isolated"
          ./native-release-qualify "$ARTIFACT_ID" "$ARTIFACT_ID.tar.gz"

      - name: Upload qualified native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_id }}
          path: |
            dist/${{ matrix.artifact_id }}.tar.gz
            dist/${{ matrix.artifact_id }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  jvm-archive:
    name: Build the JVM launcher archive
    needs: qualifier-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    # No GraalVM here — `cli/installBin` (the same task `install.sh --dev` runs) stages the
    # ordinary JVM launchers and their jars, so this job costs a plain `sbt` build rather than a
    # multi-GB, hours-long native-image compile. It is a SEPARATE artifact from the three native
    # binaries, not a replacement: the native image needs no JVM on the user's machine at all,
    # which is the whole point of shipping it; this one needs a JDK but works on any platform that
    # has one, sidesteps whatever native-image gap exists on a given release (see
    # `native-image-has-no-http-url-protocol` — this archive is unaffected by it, because it is a
    # plain `HttpURLConnection` call on a real JVM), and costs far less CI time to produce.
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # PINNED for the same reason the GraalVM step above pins its version: a floating '21' can
      # resolve to a different build on a different day, and this file's own principle is that a
      # release build must not silently vary by when it happened to run.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.9'

      - name: Setup sbt
        uses: sbt/setup-sbt@f6db8ab474efba716fc7f04441ab33714e4825af # v1

      # Same cache key as the linux native-image job's Coursier/sbt cache (both run on
      # ubuntu-latest): whichever of the two jobs finishes resolving dependencies first warms it
      # for the other, and both restore from a prior release's cache on a cold run.
      - name: Cache Coursier/sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-release-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-release-sbt-

      - name: Build the JVM launcher tree
        run: sbt cli/installBin

      - name: Assemble the JVM release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf dist/ssc-jvm.tar.gz bin
          (cd dist && sha256sum ssc-jvm.tar.gz > ssc-jvm.tar.gz.sha256)

      # Isolated the same way the native binaries are: unpacked somewhere the checkout is not, to
      # prove the archive is relocatable rather than assuming `bin/`'s relative path resolution
      # (BASH_SOURCE-based, no baked-in absolute path — verified locally before writing this job)
      # still holds once it is someone else's download.
      - name: Qualify the JVM archive in isolation
        run: |
          set -euo pipefail
          isolated="$RUNNER_TEMP/native-release-ssc-jvm"
          mkdir -p "$isolated"
          tar -xzf dist/ssc-jvm.tar.gz -C "$isolated"
          version_out=$("$isolated/bin/ssc-tools" --version)
          case "$version_out" in
            "ssc "*) ;;
            *) echo "ssc-jvm qualify: unexpected --version output: $version_out" >&2; exit 1 ;;
          esac
          printf '%s\n' "$version_out"
          fixture="$isolated/qualify-hello.ssc"
          {
            printf '# qualify\n\n'
            printf '```scalascript\n'
            printf 'def main(): Unit = println("ssc-jvm archive runs standalone")\n'
            printf '```\n'
          } >"$fixture"
          run_out=$("$isolated/bin/ssc-tools" run "$fixture")
          if [[ "$run_out" != "ssc-jvm archive runs standalone" ]]; then
            echo "ssc-jvm qualify: unexpected run output: $run_out" >&2
            exit 1
          fi

      - name: Upload the JVM archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ssc-jvm
          path: |
            dist/ssc-jvm.tar.gz
            dist/ssc-jvm.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  plugin-packages:
    name: Build registry plugin packages
    needs: qualifier-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # registry/packages.yaml advertises io.scalascript/{json,http,streams,actors,sql} as
    # installable packages, but until this job existed no GitHub Release ever attached a
    # `.sscpkg` for any of them — every entry's `github:` URL pointed at a release with no
    # matching asset, so `ssc add`/`ssc plugin install` on any of the five 404'd
    # (BUGS.md `install-channels-are-fiction`'s sibling: the channel now exists, but was never
    # loaded). These are the SAME five plugins `cli/installBin` already stages as essential —
    # `sbt <x>Plugin/packagePlugin` alone (not the full installBin tree) is the minimal build for
    # each. A SEPARATE artifact from the native/JVM archives on purpose: `release` attaches these
    # with a plain `gh release upload` after the archives are published, rather than folding them
    # into `native-release-publish`'s strict archive-only asset-set validator (`scripts/
    # native-release-publish`, `tests/e2e/native-release-publication.sh`) — that validator's
    # contract is deliberately narrow (native + JVM archives only) and well-tested against exactly
    # that set; widening it to a different asset shape (`.sscpkg`, no matching `.tar.gz` sibling)
    # would touch its every assertion for a category of asset it was never meant to gate.
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.9'

      - name: Setup sbt
        uses: sbt/setup-sbt@f6db8ab474efba716fc7f04441ab33714e4825af # v1

      - name: Cache Coursier/sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-release-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-release-sbt-

      - name: Package the five registry plugins
        run: |
          sbt jsonPlugin/packagePlugin httpPlugin/packagePlugin streamsPlugin/packagePlugin \
              actorsPlugin/packagePlugin sqlPlugin/packagePlugin

      - name: Collect packages and checksums
        run: |
          set -euo pipefail
          mkdir -p dist-plugins
          for pkg in json http streams actors sql; do
            src="v1/runtime/plugins/${pkg}-plugin/target/${pkg}-plugin.sscpkg"
            test -s "$src"
            cp "$src" "dist-plugins/${pkg}-plugin.sscpkg"
            (cd dist-plugins && sha256sum "${pkg}-plugin.sscpkg" > "${pkg}-plugin.sscpkg.sha256")
          done
          ls -la dist-plugins

      - name: Upload plugin packages
        # Named WITHOUT the `ssc-` prefix, deliberately: `release`'s archive-download step below
        # matches `pattern: ssc-*` with `merge-multiple: true` to gather every native/JVM archive
        # into one `dist/` directory for `native-release-publish`'s strict asset-set validator.
        # `ssc-plugin-packages` would match that pattern too and land its `.sscpkg` files in the
        # SAME directory, which the validator would then refuse as an unrecognized asset — exactly
        # the coupling the job comment above explains this artifact avoids.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: registry-plugin-packages
          path: dist-plugins/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish qualified tag
    needs: [native-image, jvm-archive, plugin-packages]
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout versioned publication contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download qualified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ssc-*
          path: dist
          merge-multiple: true

      - name: Download registry plugin packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: registry-plugin-packages
          path: dist-plugins

      - name: Validate and publish fresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_PROMPT_DISABLED: '1'
        run: |
          scripts/native-release-publish "$GITHUB_REF_NAME" dist

      # A second, separate `gh` call, deliberately AFTER the release is created above: uploading
      # here means these assets can never influence whether a release is created at all, only what
      # gets attached to one `native-release-publish` already validated and approved. If this step
      # fails, the release still exists with its native/JVM archives — a missing plugin package is
      # recoverable with a follow-up `gh release upload`, not a reason to have refused the release.
      - name: Attach registry plugin packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" dist-plugins/*.sscpkg dist-plugins/*.sscpkg.sha256

      # No commit-to-main step here anymore: `scripts/cut-release` writes
      # registry/packages.yaml's version/url BEFORE tagging (in the same commit `build.sbt`'s
      # version bump lands in), so the tag checked out at the top of this job already carries the
      # right entries — `qualifier-contract`'s "Verify registry plugin entries match this tag" step
      # confirmed that before any of the above ran. One less push-to-`main` in this job, one less
      # race window.
