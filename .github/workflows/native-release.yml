name: Native Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualifier-contract:
    name: Prove compare-first release refusals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run controlled archive mutations
        run: tests/e2e/native-release-qualification.sh

      - name: Run controlled publication mutations
        run: tests/e2e/native-release-publication.sh

  native-image:
    name: Qualify ${{ matrix.artifact_id }} on ${{ matrix.runner }}
    needs: qualifier-contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # native_image_xmx is sized from a MEASUREMENT, not from the tool's
          # advisory. Sampling RSS through a full local build:
          #   sbt          peak 2306 MB
          #   native-image peak 7652 MB at -Xmx6g
          # i.e. resident set ~= Xmx + 1.6 GB of native memory the heap flag does
          # not cover. That model explains every failure so far on the 7 GB arm64
          # runner: the original 5g meant ~6 GB RSS beside a live 2.3 GB sbt on a
          # 7 GB box (swap, then the watchdog's "no activity"), and 6g means
          # ~7.6 GB RSS — larger than the whole machine — which is why that build
          # crawled for over an hour.
          #
          # So arm64 gets 4g (~5.6 GB predicted RSS, fits with room for the OS)
          # and the sbt phase is a separate step so its 2.3 GB is gone before
          # native-image starts. The big runners keep generous values.
          - runner: ubuntu-latest          # 15.61 GB
            artifact_id: ssc-linux-x86_64
            native_image_xmx: 10g
          - runner: macos-latest           # 7.00 GB — the binding constraint
            artifact_id: ssc-macos-arm64
            native_image_xmx: 4g
          - runner: macos-15-intel         # 14.00 GB
            artifact_id: ssc-macos-x86_64
            native_image_xmx: 9g

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # PINNED, and the value is 21.0.9 for a hard reason: Oracle ships no macOS
      # x64 build after it. Verified against the archive rather than assumed --
      #   21.0.9   macos-x64 200   macos-aarch64 200   linux-x64 200
      #   21.0.11  macos-x64 404   macos-aarch64 200   linux-x64 200
      #   21.0.12  macos-x64 404   macos-aarch64 200   linux-x64 200
      # so 21.0.9 is the newest version that exists on all three release targets.
      # A first attempt pinned 21.0.11, chosen because that is what was installed
      # on the arm64 machine it was tested on, and macos-15-intel then failed in
      # `Setup GraalVM` before compiling anything.
      #
      # Pinning at all is the point: `java-version: '21'` floats, and it was the
      # single unpinned input in a file where every action is pinned by SHA, so
      # one tag could be built by different toolchains on different days -- and,
      # worse, by DIFFERENT versions per platform in the same run, since '21'
      # resolves to the newest build available for each.
      # tests/BUGS.md native-release-native-image-three-defects.
      - name: Setup GraalVM 21
        uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1
        with:
          java-version: '21.0.9'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup sbt
        uses: sbt/setup-sbt@f6db8ab474efba716fc7f04441ab33714e4825af # v1

      # SPLIT INTO TWO sbt INVOCATIONS ON PURPOSE. These used to be one command,
      # which meant the sbt JVM — measured at 2306 MB peak RSS after compiling —
      # was still resident while native-image asked for its own multiple GB. On
      # the 7 GB arm64 runner that 2.3 GB is the difference between building and
      # swapping. Letting sbt exit first costs a few seconds of reloading the
      # build definition and buys back a third of that machine.
      - name: Build jars and staged layout
        run: |
          sbt \
            "cli/installBin" \
            "pluginHost/assembly"

      - name: Build native binary
        env:
          SSC_NATIVE_IMAGE_XMX: ${{ matrix.native_image_xmx }}
        run: |
          # sbt is gone from the previous step; this invocation compiles nothing
          # and only forks native-image, so its own footprint stays small.
          sbt "cli/graalvm-native-image:packageBin"

      - name: Assemble release payload
        env:
          ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p dist/archive/lib dist/archive/bin/lib/standard

          native_binary=v1/tools/cli/target/graalvm-native-image/scalascript-cli
          test -x "$native_binary"
          cp "$native_binary" "dist/$ARTIFACT_ID"
          chmod +x "dist/$ARTIFACT_ID"
          cp "dist/$ARTIFACT_ID" dist/archive/ssc

          shopt -s nullglob
          plugin_hosts=(v1/tools/plugin-host/target/scala-*/ssc-plugin-host.jar)
          if [[ ${#plugin_hosts[@]} -ne 1 ]]; then
            printf 'plugin-host collection: expected=1 actual=%s paths=%s\n' \
              "${#plugin_hosts[@]}" "${plugin_hosts[*]:-<none>}" >&2
            exit 1
          fi
          cp "${plugin_hosts[0]}" dist/archive/lib/ssc-plugin-host.jar
          test -s dist/archive/lib/ssc-plugin-host.jar

          test -d bin/lib/standard/native-front
          cp -R bin/lib/standard/native-front \
            dist/archive/bin/lib/standard/native-front
          cp README.md dist/archive/README.md

      - name: Manifest and compress release payload
        env:
          ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          set -euo pipefail
          front=dist/archive/bin/lib/standard/native-front
          python3 - "$front" <<'PY'
          import hashlib
          import os
          import sys

          root = os.path.realpath(sys.argv[1])
          manifest = os.path.join(root, "MANIFEST.sha256")
          if os.path.lexists(manifest):
              os.remove(manifest)

          paths = []
          for directory, directories, files in os.walk(root):
              directories.sort()
              files.sort()
              for name in files:
                  absolute = os.path.join(directory, name)
                  if os.path.islink(absolute):
                      raise SystemExit(f"native-front manifest refuses symlink: {absolute}")
                  paths.append(os.path.relpath(absolute, root).replace(os.sep, "/"))

          with open(manifest, "w", encoding="utf-8", newline="\n") as output:
              for relative in sorted(paths):
                  digest = hashlib.sha256()
                  with open(os.path.join(root, *relative.split("/")), "rb") as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                          digest.update(chunk)
                  output.write(f"{digest.hexdigest()}  {relative}\n")
          PY

          archive="dist/$ARTIFACT_ID.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C dist/archive \
            ssc lib bin README.md
          if command -v sha256sum >/dev/null 2>&1; then
            digest=$(sha256sum "$archive" | awk '{print $1}')
          else
            digest=$(shasum -a 256 "$archive" | awk '{print $1}')
          fi
          printf '%s  %s\n' "$digest" "${archive##*/}" >"$archive.sha256"

      - name: Qualify isolated shipped bytes
        env:
          ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          set -euo pipefail
          isolated="$RUNNER_TEMP/native-release-$ARTIFACT_ID"
          mkdir -p "$isolated"
          cp "dist/$ARTIFACT_ID" "$isolated/"
          cp "dist/$ARTIFACT_ID.tar.gz" "$isolated/"
          cp "dist/$ARTIFACT_ID.tar.gz.sha256" "$isolated/"
          cp scripts/native-release-qualify "$isolated/"
          chmod +x "$isolated/$ARTIFACT_ID" "$isolated/native-release-qualify"

          # A native image with a captured checkout root must fail here. Hide
          # both current and legacy staged frontend layouts before execution.
          mv bin/lib/standard/native-front \
            "$RUNNER_TEMP/hidden-standard-native-front"
          mv bin/lib/native-front \
            "$RUNNER_TEMP/hidden-legacy-native-front"

          cd "$isolated"
          ./native-release-qualify "$ARTIFACT_ID" "$ARTIFACT_ID.tar.gz"

      - name: Upload qualified native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_id }}
          path: |
            dist/${{ matrix.artifact_id }}
            dist/${{ matrix.artifact_id }}.tar.gz
            dist/${{ matrix.artifact_id }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish qualified tag
    needs: native-image
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout versioned publication contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download qualified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ssc-*
          path: dist
          merge-multiple: true

      - name: Validate and publish fresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_PROMPT_DISABLED: '1'
        run: |
          scripts/native-release-publish "$GITHUB_REF_NAME" dist
