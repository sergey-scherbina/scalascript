name: Corpus Contract

# The always-on differential gate (tests/conformance/contract.sc): both corpora
# × lanes {int, js, v2} diffed against the golden, compared to corpus-baseline.tsv.
# Runs nightly + on demand rather than per-PR. It is RED on any regression or on a
# closed gap that wasn't recorded in the baseline. See tests/conformance/CONTRACT.md.
#
# SHARDED since 2026-07-27 (corpus-contract-shard-fix), and here is why — the header
# used to say "~415 cases × 3 lanes … ~25 min" and that estimate went stale silently:
# by 2026-07-27 the corpus was 485 cases and per-case cost had grown (F is the default
# native front since 56d7d705f and is 2-4× slower), so a full pass needed ~95-100 min
# against a 60-min budget. Result: 13 runs, ZERO green — 3 `failure` then 10 killed at
# the wall. A job timeout surfaces as `cancelled`, NOT `failure`, so it read as benign
# and the whole F4 front-flip landed without its differential net.
#   ⇒ If you ever see this workflow `cancelled`, treat it as RED, not as "someone
#     cancelled it" — and re-check the per-shard budget below rather than raising the
#     timeout, which is what hid the growth last time.
# 4 round-robin shards ≈ 6 min setup + ~24 min cases each; the 60-min guard stays as a
# guard, not as the operating point.
#
# TODO: add memo (F2) + batch lanes (F4) like run.sc, then promote to a per-PR gate.

on:
  schedule:
    - cron: '0 4 * * *'   # nightly, 04:00 UTC
  workflow_dispatch: {}

jobs:
  contract:
    name: Corpus Contract shard ${{ matrix.shard }}/4 (int/js/v2 differential)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Round-robin shards (idx % 4), not contiguous blocks — the corpus is name-sorted
    # and the slow cases cluster by name. fail-fast: false so one red shard still lets
    # the others report; a partial verdict is what made the timeout unreadable.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # JAVA FIRST, AND `jvm: system` — BOTH HALVES ARE THE FIX. `scala-cli-setup` used to run first
      # with `jvm: temurin:21`, and resolving that NAME into a download URL makes coursier fetch
      # https://raw.githubusercontent.com/coursier/jvm-index/master/index.json. On 2026-08-17 GitHub
      # rate-limited that URL — 429 — and coursier reports a 429 as `NotFound: not found`, so the
      # step died with a message about a missing file that is not missing. Twelve consecutive runs
      # by different agents went red in `Setup Scala CLI` BEFORE a single test executed; a docs-only
      # commit was among them, which is what proved it was not anyone's change.
      #
      # With Java installed first, `jvm: system` means scala-cli uses the JVM already on the runner —
      # the same Temurin 21 — and the index is never consulted. Pinning the version was not the
      # problem; asking a rate-limited service to translate the pin was.
      #
      # KEEP THE ORDER. Swapping these back re-introduces the dependency even if `jvm: system` stays,
      # because then "system" is whatever the image happened to ship rather than the Java this
      # workflow asked for.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Scala CLI
        uses: VirtusLab/scala-cli-setup@v1
        with:
          power: true
          jvm: system

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Cache Coursier/sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      # Distinct cache prefix (…-v2-contract-) from the conformance/sbt jobs: their
      # zinc analyses are built with different sbt invocations and are not
      # interchangeable (sharing re-creates the crypto-spi "not a member" poison).
      - name: Restore compiled classes (zinc)
        uses: actions/cache/restore@v4
        with:
          path: |
            **/target/scala-*/classes
            **/target/scala-*/test-classes
            **/target/scala-*/zinc
            **/target/streams
          key: ${{ runner.os }}-classes-v2-contract-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-classes-v2-contract-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-

      - name: Build ssc launcher (sbt-assembly)
        run: bash install.sh --dev

      # The `--` is load-bearing: without it scala-cli claims `--shard` as its own flag
      # and dies with "Unrecognized argument" before the script starts. The pre-shard
      # command passed no script arguments at all, so this separator was never needed here.
      # `--lane-timeout 240`, raised from the script's 90 s default for THIS host only.
      #
      # Run 30542056391 reported `scljet-jdbc  v2  TIMEOUT` — the single slowest v2-lane case, and
      # the only timeout in its shard; the other scljet cases in the same shard passed, so this is a
      # case sitting just past the budget, not a systematic hang. MEASURED locally on an idle
      # many-core host:
      #
      #   examples/scljet-jdbc.ssc, v2 lane:  25 s under F (default),  10 s under SSC_FRONT=legacy
      #   v2 stdout is BYTE-IDENTICAL to the int lane (19 lines, rc 0 on both)
      #
      # That last line is why raising the ceiling is the right move rather than a cover-up: with a
      # sufficient budget the row becomes PASS, not DIVERGE. The case is correct; only the budget was
      # wrong for this host. A GitHub runner has 2 cores and `contract.sc` derives
      # `workers = min(4, max(2, cores - 2)) = 2`, so two JVM-heavy F-front compiles share two cores —
      # and the harness only reports TIMEOUT after the case exceeds the budget TWICE (it retries once
      # on 124), so 90 s was being missed twice over.
      #
      # A timeout is a CEILING, not a sleep: nothing pays for it while cases finish in time. 240 is
      # chosen so the known-correct slowest case cannot flap, NOT as a measured runtime — if a case
      # ever approaches it, that is the perf item firing and the answer is to read the per-case cost,
      # not to raise this again (the same discipline `ci.yml` states about its job timeout).
      #
      # The real item is unchanged and stays visible: `f-front-compile-cost-7x-on-scljet`. The script's
      # own comment at `contract.sc:125-134` already argues this separation — a correctness gate that
      # reports perf as TIMEOUT noise trains people to ignore it, which is how this gate died once
      # before (seven scljet cases reported as false `v2 TIMEOUT` regressions in run 30281019432).
      - name: Run corpus contract (shard ${{ matrix.shard }}/4)
        run: scala-cli tests/conformance/contract.sc -- --shard ${{ matrix.shard }}/4 --lane-timeout 240
