name: CI

# A commit that changes NO code does not get a CI run. This is the other half of
# `ci-runs-cancelled-under-churn`: the concurrency block below collapses the queue to "one running
# plus one pending", but it does not decide WHICH commit gets that pending slot — so a docs commit
# pushed seconds after a code commit evicts the code commit's run, and the code commit never gets a
# verdict at all.
#
# MEASURED 2026-07-28 over one hour on `main`: 80 commits, 58 of them without `[skip ci]` (i.e. each
# creating a run), and **43 of those 58 changed ONLY `.md` or `.work/` files**. ~74% of the CI load
# carried no code while `sbt — compile and test` takes 3h16m and 62 runs were queued; the last
# `success` on this workflow was 2026-07-27T16:31:33Z, nine hours earlier.
#
# `[skip ci]` already exists and 22 of those 80 commits used it — the other 58 did not. A rule that
# depends on every agent remembering it is a wish, not a rule; `paths-ignore` is the same intent as
# enforcement. It CANNOT hide a code change: GitHub skips the run only when EVERY changed path
# matches, so a commit touching code AND a doc still runs in full.
#
# This does not weaken the evidence ladder — AGENTS.md §4c already tells you that `[skip ci]`
# bookkeeping commits leave HEAD without a run of its own and that you verify the newest CODE
# commit. This makes that documented practice reliable instead of discretionary.
on:
  # NO `push:`. Since 2026-08-01 the only thing a push runs is `smoke.yml`; everything in this file
  # is nightly or on demand. Leaving a push trigger with every job gated off it produced a run whose
  # jobs were ALL skipped and which then reported `success` — a green that meant nothing, and the
  # exact thing that made `ci.yml` unreadable as evidence for weeks. A workflow that has nothing to
  # do on a push should not be triggered by one.
  #
  # Markdown still lints on every push: `.github/workflows/lint-markdown.yml` does it independently.
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.work/**'
  # ── THE THREE TIERS ────────────────────────────────────────────────────────────────────────────
  #
  # Restructured 2026-08-01 (ci-three-tiers). There are three levels of check and this file holds
  # two of them; which one you get is decided by the EVENT, not by a separate workflow, so the
  # ~200 lines of runner setup are not duplicated into a second file that would drift from this one.
  #
  #   1  smoke   `.github/workflows/smoke.yml` — EVERY push, the ONLY thing a push runs.
  #              27 checks, ~157 s locally. This is the per-commit signal.
  #   2  main    THIS FILE, NIGHTLY (+ PR + dispatch): lint + validate + conformance x4 + examples.
  #              ~14 min wall, ~63 runner-min. Green BY CONSTRUCTION — every residual red in the
  #              corpus is a `known-red:` declaration naming its BUGS slug and its expiry.
  #   3  full    THIS FILE on `workflow_dispatch` ONLY: everything in 2 plus `sbt — compile and
  #              test` (152 min) and the negtc release gate (~40 min). Asked for, never scheduled.
  #
  # WHY NOTHING HEAVY IS ON PUSH, measured over ten full runs before the split: sbt 4/10 green at
  # 152 min, conformance shard 0 0/10 — against lint 10/10, validate 10/10, examples 10/10, negtc
  # 10/10. The instability was concentrated and so was the cost. Tier 2 briefly ran on push and was
  # green there (run 30705233464, 7/7, 14 min), but a 63-runner-minute tier against a 3-7 min push
  # interval buys one verdict per several commits at best; nightly costs one run a day and answers
  # the same question. The per-commit answer is smoke's job.
  #
  # WHY 3 IS DISPATCH-ONLY: a nightly of a 152-minute job spends ~150 runner-minutes to tell you in
  # the morning about a commit you can no longer cheaply bisect. Ask for it when it answers
  # something — before a release, or when the change is in that territory.
  schedule:
    - cron: '0 3 * * *'   # once nightly. Was every 4 h; see the tier note above.
  workflow_dispatch:

# Without this, CI could not deliver a verdict at all under the project's push rate.
#
# MEASURED 2026-07-27 (BUGS.md ci-runs-cancelled-under-churn): of the last 60 CI runs, ZERO had
# completed — 55 queued, 5 running — and the oldest queued run had been waiting over three hours.
# Across the last 100 runs of all workflows, 16 CI runs were in progress SIMULTANEOUSLY. At four
# jobs per run that is ~64 concurrent jobs, which sits above the account's concurrent-job budget, so
# the budget stayed saturated by `sbt` jobs (timeout-minutes: 300) and everything newer queued behind
# them until it was evicted or cancelled. A `cancelled` gate is RED, not neutral (MILESTONES.md), so
# the apparatus meant to establish trust was quietly producing reds for commits that were fine.
#
# `cancel-in-progress: false` is deliberate: a run that is ALREADY EXECUTING is never killed, so a
# long `sbt` job still reaches a verdict. What GitHub does cancel is the previously PENDING run in
# the group — so the queue collapses from 55 deep to at most one running plus one pending per ref,
# and the newest commit is always the next thing to run.
#
# The cost, stated plainly: intermediate commits get no verdict of their own. They get none today
# either — they queue for hours and are then cancelled — so this trades a silent red for an explicit
# supersede, which is what makes the green-descendant evidence ladder in AGENTS.md §4c usable.
# The scheduled run gets its OWN group. Sharing one would defeat the whole change: a scheduled
# `sbt` run sitting in the pending slot would be evicted by the next code push, which is exactly the
# eviction this workflow already documents — and the long job would never reach a verdict again,
# only now nightly instead of per-push.
#
# THIRD GROUP, added 2026-07-28: `workflow_dispatch` gets a group keyed by SHA, so a verdict can be
# OBTAINED ON DEMAND. Until now dispatch shared the push group, which made it useless for the one
# thing it is for — measured across a full working session, three separate runs carrying a specific
# commit were each superseded and cancelled before starting a single job, and a manual dispatch would
# have been evicted by the very next push exactly the same way. AGENTS.md §4c asks for the strongest
# evidence you can get; with no obtainable verdict, level 1 was unreachable by construction and every
# release-claim in that session had to say "level 3, local gates".
#
# Keyed by `github.sha`, not just the ref, so two dispatches for different commits do not evict each
# other either. This does NOT change push behaviour: the queue policy above is a measured trade and
# stays exactly as it was.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'scheduled' || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.sha) || 'push' }}
  # `false`, and now unconditionally: this workflow has no push trigger, so the per-push cancelling
  # that briefly lived here has nothing left to cancel. It was `${{ github.event_name == 'push' }}`
  # while tier 2 ran on push; leaving that expression would be a condition that can never be true,
  # which reads to the next person as if push runs still happen here.
  #
  # The reason for `false` is the one written above and unchanged: a run that is ALREADY EXECUTING
  # is never killed, so a long `sbt` job still reaches a verdict, and a dispatch is somebody asking
  # about one specific SHA.
  cancel-in-progress: false

jobs:
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # WHY EVERY VERIFICATION STEP CARRIES `if: always()` (added 2026-08-15).
    #
    # Steps are fail-fast by default, so the FIRST red here hid every step after it. Measured over
    # the last twelve ci.yml runs: this job failed on EVERY one since 2026-08-05, the failing step
    # MOVED (13 bench-seed -> 8 BUGS-header -> 10 path-area-map -> 9 TASK-regions), and the number of
    # steps skipped behind it grew from 11 to 25. A gate added to this job bought nothing.
    #
    # AND THE HEADER ABOVE WAS WRONG ABOUT THE COST. It says "Every gate this job runs is also in the
    # smoke suite", offered as the reason taking this job off push was safe rather than a coverage
    # cut. Measured: 13 of 29 steps are in scripts/smoke-ci.ssc and 16 are NOT — build-rust-refuses-
    # loudly, launcher-digest-gate, std-import-lanes-gate, three rust parity gates,
    # http-bind-address-gate and others. Those sixteen have no home anywhere else, so while this job
    # is red they do not run at all.
    #
    # SAFE TO TURN ON, measured before landing rather than hoped: all 29 single-command steps were run
    # locally on this tree and 28 passed. The only red is the path->area map (board-ownership drift).
    # So this reveals no hidden pile — it restores 25 checks and leaves the one red already visible.
    #
    # Checkout and Setup Scala CLI are deliberately NOT always(): without them the rest cannot run,
    # and a step that cannot run should be skipped rather than reported.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint Markdown
        run: markdownlint '**/*.md' --ignore '**/node_modules/**'   # NOT `node_modules`: that only
          # matches a top-level one, so the same command run locally reports dozens of errors from
          # payments/**/node_modules that CI never sees. A lint an agent cannot reproduce locally
          # is a lint they learn to ignore.

  validate:
    name: Validate ScalaScript
    runs-on: ubuntu-latest
    # ── TIER 2. NOT on push: this workflow has no `push:` trigger — see `on:` at the top. ─────
    # These three job headers said "runs on EVERY push" until 2026-08-13, and that stopped being
    # true on 08-01 when the trigger was deleted (the paragraph in `on:` explains why). A comment
    # claiming a job runs more often than it does is how "wired" quietly becomes "wired and never
    # runs" — the state `v1-jit-size.sh` sat in for a month, and the reason the gate wired into this
    # job below warns you to check the `on:` and the `if:` yourself.
    # It was taken off push on 2026-07-30 because the push path had no verdict at all — 83 of 100
    # runs cancelled — and smoke.yml became the per-push signal. Two things changed since, and
    # together they make this affordable again: the conformance job is a 4-way shard (~13 min, not
    # 37.7), and the push concurrency group now CANCELS in progress, so the tier costs one run at a
    # time instead of one per push. smoke.yml is still the fast first word; this is the verdict.
    # Every gate this job runs is also in the smoke suite (scripts/smoke-ci.ssc), which is what
    # made taking it off push safe rather than a coverage cut: the list of what runs on a push lives
    # in ONE place now, and it is that file. The one step not carried over is the three `test -f`
    # example-file checks, which the examples pass in `conformance-extras` covers.
    # 45. SIZED FROM THE RUNNER, because 25 was sized from a laptop and the job was CANCELLED.
    # Local run of all 32 gate steps: 851 s. Same steps on the runner: 1803 s across 49 steps — 2.1x,
    # and that is before the 260 s launcher build. The gates that dominate are the cargo ones
    # (`v2 diagnostics and fast paths` 295 s, `conformance flags and the scljet corpus` 221 s,
    # `a Response handler takes the Request entry` 138 s, `build-rust refuses loudly` 132 s), and a
    # dev box with a warm cargo cache is not the runner.
    #
    # THE RULE THIS COST TWICE TODAY: size a CI budget from CI. The audit job made the identical
    # mistake in the other direction — 737 s measured inside a warm job, 1193 s when it ran alone.
    # A generous cap costs nothing here; a tight one costs the whole verdict, and reports it as
    # `cancelled` so it does not even look like a failure.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # FULL HISTORY, and the gate below cannot work without it.
          #
          # `board-ownership-check` resolves every entry's `fixed-in:` sha with
          # `git show --name-only <sha>` to learn which board owns that code. On the default
          # depth-1 checkout those commits are not in the clone, so the lookup fails silently and
          # the check computes a DIFFERENT misfiling set from the one any developer sees.
          #
          # Measured 2026-08-15 on one tree, two checkouts:
          #     full history   470 entries resolved, exit 0
          #     depth-1 clone   83 entries resolved, exit 1
          #
          # That is why `area-map-gate` was red here for days while passing locally, and why
          # refreshing its baseline from a full clone did not fix CI: the two are not looking at
          # the same data. A gate whose verdict depends on clone depth has to say which it needs.
          fetch-depth: 0

      - name: Setup Scala CLI
        uses: VirtusLab/scala-cli-setup@v1
        with:
          power: true
          jvm: temurin:21

      # ── A TOOLCHAIN, because 16 of this job's gates could never pass without one. ───────────────
      #
      # Measured on the 2026-08-15 nightly, the first run after this job stopped being fail-fast:
      # 18 steps failed and most said the same thing —
      #     http-bind-address-gate: no launcher at .../bin/ssc-tools — run ./install.sh --dev
      # This job had `Checkout` and `Setup Scala CLI` and nothing else, while 19 of its 31 gate
      # invocations reference `bin/ssc*`. They were wired into a job that CANNOT run them, and the
      # old fail-fast red at step 10 meant nobody ever saw the message saying so.
      #
      # The build is ~246 s with a warm zinc cache against this job's ~1-3 min of checks, which is
      # why the toolchain comes here rather than the gates moving out: `conformance-extras`, the
      # other job with a launcher, was itself timing out and had no room to take them.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Verify dev installer worktree isolation
        run: tests/e2e/install-worktree-submodule-guard.sh

      - name: Cache Coursier/sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      # Restore-only, sharing the conformance job's prefix: this job runs the same `install.sh --dev`
      # invocation as the shards, so their zinc analyses ARE interchangeable (unlike the sbt job's —
      # see the note on that job's restore step). It never SAVES, so it cannot poison the prefix.
      - name: Restore compiled classes (zinc)
        uses: actions/cache/restore@v4
        with:
          path: |
            **/target/scala-*/classes
            **/target/scala-*/test-classes
            **/target/scala-*/zinc
            **/target/streams
          key: ${{ runner.os }}-classes-v2-conf-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-classes-v2-conf-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-

      - name: Build ssc launcher (sbt-assembly)
        run: bash install.sh --dev


      - name: Validate front-matter
        if: always()          # see the block above this job's steps
        run: scala-cli --server=false ./v1/tools/scripts/validate-frontmatter.scala

      - name: Check example files exist
        if: always()          # see the block above this job's steps
        run: |
          test -f examples/hello.ssc
          test -f examples/typed-data.ssc
          test -f examples/imports.ssc
          echo "All example files present"

      - name: Verify exact-SHA CI status guard
        if: always()          # see the block above this job's steps
        run: tests/e2e/ci-status-guard.sh

      # Seconds long, and it closes a gap that twice cost an hour: the four freezes recording
      # "expected to fail" had no invariant between them, so a half-updated pair stayed invisible
      # until either the nightly Corpus Contract or the hour-long sbt job happened to run.
      - name: Verify the freezes agree about the same case
        if: always()          # see the block above this job's steps
        run: tests/e2e/freeze-consistency-gate.sh

      # Seconds long. The tracker's status used to live in prose, and hand-tidying is exactly what
      # produced 108 entries with no status at all and three words for "closed" — so the invariant
      # is enforced here rather than trusted. --self-test first: a gate nobody has seen fail is a
      # hypothesis, and this one plants three defects and requires all three to be caught.
      - name: Verify every BUGS.md entry has a valid machine-readable header
        if: always()          # see the block above this job's steps
        run: tests/e2e/bugs-index-gate.sh --self-test

      # A TASK/ document is prose with a GENERATED index in it. Without this the index becomes a
      # stale second copy of the boards, which is the whole objection to per-type files. --self-test
      # because a golden diff over zero regions passes forever and proves nothing.
      - name: Verify TASK/ generated regions agree with the module boards
        if: always()          # see the block above this job's steps
        run: tests/e2e/task-views-gate.sh --self-test

      # The path→area map has to stay TOTAL (new code resolves to an area), DETERMINISTIC
      # (longest-prefix, order-independent) and CONSISTENT with the bugs-index enum — and it
      # also checks that a bug sits in a board owning the code it names.
      #
      # TIER 2, deliberately not smoke. This runs a repo-wide walk over every BUGS.md and every
      # code directory: right for the nightly and for a PR, too slow for the per-push budget
      # smoke already exceeds. Sergiy's call, 2026-08-09.
      #
      # It was red on origin/main for an unknown length of time before this — and the reason is
      # the point of adding it: it lived nowhere in CI, so only a hand invocation ever saw it.
      # Ten board-ownership misfilings had accumulated and one baselined row had gone stale.
      # The baseline was refreshed rather than the entries refiled, which is what the baseline
      # is for and says so in its own header: "a check that is red on arrival gets ignored, and
      # an ignored check is worse than none." Refiling ten other people's bugs would mean
      # guessing which board owns each, and a wrong guess writes a false record onto a durable
      # board — worse than the drift. The frozen rows stay visible and each one is somebody's
      # to fix.
      #
      # Verified to still discriminate after the refresh, three arms: as landed it PASSES;
      # delete one baseline row (a new misfiling) and it FAILS naming it; add a bogus row (a
      # stale one) and it FAILS naming that. A refreshed baseline that no longer fails is just
      # a blindfold with a green tick.
      - name: Verify the path→area map is total and each board owns its bugs' code
        if: always()          # see the block above this job's steps
        run: tests/e2e/area-map-gate.sh

      # POLICY.md is the single source for the process rules; the specs keep mechanism and evidence.
      # This catches the two things that are decidable — a rule copied verbatim into a second
      # document, and an entry point that stopped linking here. It cannot detect a paraphrase, and
      # says so in its own header rather than implying otherwise.
      - name: Verify each process rule is stated in POLICY.md and nowhere else
        if: always()          # see the block above this job's steps
        run: tests/e2e/policy-single-source.sh --self-test

      - name: Verify standalone release installer launcher
        if: always()          # see the block above this job's steps
        run: tests/e2e/release-installer-launcher.sh

      - name: Verify benchmark wrapper routing
        if: always()          # see the block above this job's steps
        run: tests/e2e/bench-wrapper-gate.sh

      # Moved off the smoke suite 2026-08-03: at 45.4 s it was the most expensive check there and
      # the suite had just gone over its own 420 s budget with all 57 checks green, so every push
      # failed (`tests/BUGS.md smoke-suite-over-its-own-budget`). This tier is also per-push, so
      # the per-commit answer is unchanged — it now comes out of a 14-minute budget instead of a
      # 7-minute one. It belongs next to `bench-wrapper-gate.sh`: that one checks `scripts/bench`
      # builds the right sbt command, this one checks `ssc bench`'s GENERATED wrapper passes a seed
      # of the type the workload DECLARES and actually measures. Three lanes x two seed types; the
      # Long fixture is the control that says the gate itself still works.
      - name: Verify benchmark wrapper seed typing
        if: always()          # see the block above this job's steps
        run: tests/e2e/bench-seed-type-gate.sh

      # Both moved off the smoke suite 2026-08-03, the day they were added, when the suite went over
      # its 420 s budget for the second time (425.6 s, all 60 checks green). This tier is also
      # per-push, so the per-commit answer is unchanged.
      #
      # `std-import-lanes` pins a build-breaking property: `compile-jvm` refused a `std/` import that
      # `run --v1` and `run-js` accepted, because the JVM lane and the std-root discovery disagreed
      # about where the standard library is. Three cells — jvm in-tree, jvm out-of-tree, int as the
      # control. `build-smoke` checks `ssc build` produces a page byte-identical to `ssc render`.
      - name: Verify std imports resolve on every lane
        if: always()          # see the block above this job's steps
        run: tests/e2e/std-import-lanes-gate.sh

      - name: Verify ssc build matches ssc render
        if: always()          # see the block above this job's steps
        run: tests/e2e/build-smoke.sh

      # Orphaned and red since v1.7 Tier 2 changed the archive layout out from under it: it asserted
      # `bundle.yaml` at the root where the format has `manifest.yaml` + a `sources/` prefix, so it
      # failed at its FIRST assertion and nothing after it had ever run. Three cases now pass —
      # in-tree imports round-trip, multi-entry, and an above-root import flattened into
      # `sources/_external/` with its reference rewritten. Tier 2 rather than the smoke suite: that
      # suite has been over its budget twice this week. (BUGS.md
      # bundle-command-resolves-imports-relative-only.)
      - name: Verify ssc bundle round-trips
        if: always()          # see the block above this job's steps
        run: tests/e2e/bundle-smoke.sh

      - name: Verify claim mutex (concurrent claims collide)
        if: always()          # see the block above this job's steps
        run: tests/coord/claim-mutex-conflict.sh

      - name: Verify claim guards refuse overlap and out-of-scope commits
        if: always()          # see the block above this job's steps
        run: tests/coord/claim-hooks.sh

      - name: Verify no test can reach an exiting CLI boundary
        if: always()          # see the block above this job's steps
        run: tests/e2e/cli-exit-reachability-guard.sh --self-test

      # Guards the sharding that the Conformance Suite matrix below depends on. It lives HERE, in
      # the 34-second job, because `run.sc --list` enumerates the corpus without needing a built
      # launcher — so the property gets checked on every push for seconds rather than behind a
      # 3.6-minute assembly. A shard scheme that drops cases fails GREEN; this is the check that
      # makes that impossible (AGENTS.md: build the gate before the feature).
      - name: Verify conformance shards partition the corpus exactly
        if: always()          # see the block above this job's steps
        run: tests/e2e/build-conformance-shard-gate.sh 4

      # The negtc equality gate does NOT go here, though it is the obvious-looking home. This job has
      # no `installBin`, so `negtc-mapreduce-gate.sh` would take its no-launcher branch, print
      # "merge invariants PASSED (equality skipped)" and exit 0 — a step that reads as gating the
      # property while never running it. It lives in `negtc-reduce`, which builds the tower and is
      # the job whose verdict actually depends on the property.

      # The host RAM guards (scripts/build-guard, build-ram-report, kill-stale-builders) are what
      # stand between parallel agents and a third OOM event. Each of their failure modes is silent —
      # a semaphore that admits everyone, a heap cap that loses to an inherited -Xmx, a slot that
      # leaks on failure — so they get a gate that observes real processes and real MaxHeapSize.
      - name: Verify host build-RAM guards actually guard
        if: always()          # see the block above this job's steps
        run: tests/e2e/build-ram-budget-gate.sh

      # ── seven gates that ran nowhere, wired to TIER 2 on 2026-08-02 ─────────────────────────
      #
      # 52 of the 126 scripts in tests/e2e were invoked by nothing — no workflow, no suite, no other
      # script. Running all 52 measured 19 passing, 26 failing, 6 hanging past 180 s. The twelve
      # cheapest passing ones went to `scripts/smoke-ci`; these are the rest, 14-59 s each and ~3 min
      # together, which fits a 14-minute nightly tier and does not belong on the push path.
      #
      # The 33 that do not pass are filed as `orphaned-e2e-gates-52` rather than wired red or deleted
      # unexamined: none is provably dead, and a red gate nobody asked for is how a suite becomes
      # noise people learn to ignore.
      - name: Gates without a home — v21 native surface
        if: always()          # see the block above this job's steps
        run: |
          tests/e2e/v21-native-dynamic-tostring-smoke.sh
          tests/e2e/v21-native-md-interpolator-smoke.sh

      - name: Gates without a home — v2 diagnostics and fast paths
        if: always()          # see the block above this job's steps
        run: |
          tests/e2e/v2-error-diagnostic.sh
          tests/e2e/v2-f-nested-bytecode-fast-path.sh
          tests/e2e/v2-swift-cli.sh

      - name: Gates without a home — conformance flags and the scljet corpus
        if: always()          # see the block above this job's steps
        run: |
          tests/e2e/conformance-lanes-flag.sh
          tests/e2e/scljet-m2-corpus-smoke.sh

      # Was in neither tier, which is why its failure went unread for weeks and got recorded in the
      # orphan census as "empty output" — the gate discarded stderr. It runs four lanes end to end,
      # one of them a scala-cli JVM compile: 6.5 s local, so it belongs here and not under the smoke
      # suite's 420 s cap. Its JVM row is a DECLARED known-red naming its BUGS slug, and the gate
      # fails if that row starts passing.
      # The name is QUOTED: `package: ` inside an unquoted scalar is a mapping key, and yq rejected
      # the whole file for it (`mapping values are not allowed in this context`) — a workflow that
      # does not parse runs nothing at all.
      - name: "Gates without a home — the package: keyword across four lanes"
        if: always()          # see the block above this job's steps
        run: tests/e2e/package-keyword-smoke.sh

      # A parameterless def across a module import. This one cannot live in tests/conformance/: every
      # import in that corpus points into `std/`, and the shape needs a fixture pair the case writes
      # itself. It is also the only place the defect is visible — the single-file cases in
      # `parameterless-def-*.ssc` stayed green through two implementations that a module import
      # still handed a closure. Two rows, ~4 s.
      - name: Gates without a home — a parameterless def across a module import
        if: always()          # see the block above this job's steps
        run: tests/e2e/parameterless-def-import-gate.sh

      # The LEGACY front. `tests/conformance/parameterless-def-local.ssc` pins the same rule for the
      # default front and is structurally blind to this one — a corpus case cannot set `SSC_FRONT` —
      # which is exactly why the legacy half stayed broken for a day after F was fixed, with the
      # corpus green and one front still printing `<closure>` and exiting 0. Three rows, ~6 s.
      - name: Gates without a home — a parameterless def on the legacy front
        if: always()          # see the block above this job's steps
        run: tests/e2e/legacy-front-parameterless-gate.sh

      # MOVED OFF THE PUSH PATH, 2026-08-11, with sbt-plugin-scripted above: 62.3 s and 48.0 s of a
      # 732 s smoke suite that was hitting its own 20-minute job timeout and reporting `cancelled`.
      - name: build-rust refuses loudly
        if: always()          # see the block above this job's steps
        run: tests/e2e/build-rust-refuses-loudly.sh

      # Beside the gate above because it needs the same thing — cargo — and for the same reason it
      # is not on the push path. Two user reports from rozum, one line apart in the Rust runtime
      # template: `"abc".toInt` was 0 on this lane and fatal on `run`, and `"ab".toList` was a
      # closure on `run` and a list here. Same shape both times — same source, same input, two
      # answers, no diagnostic. The rows assert the halves that are FIXED (the `_to_int` path and
      # `String.toList`); the inline `parse::<i64>().unwrap_or(0)` emissions in RustCodeWalk are
      # still open and named in the entry. 9 s warm; the crates pull no dependencies.
      - name: a numeric conversion answers the same on both lanes
        if: always()          # see the block above this job's steps
        run: tests/e2e/rust-toint-parity-gate.sh

      # Two more rozum reports, both `impact: blocks`, both about the HTTP lane and both asserted
      # over a real socket rather than by "it compiles": a handler declared `Request => Response`
      # was lowered with a `-> String` callback, so the crate did not build and a handler could only
      # ever answer 200; and a query value arrived raw — `%3A` stayed `%3A`, `+` stayed `+` — while
      # `run` decoded both, so a route keyed on the value silently matched nothing. The rows compare
      # the two lanes' answers to the SAME request, so a change that moves both together still
      # fails. ~25 s: two cargo builds, four server starts, ports picked per run.
      - name: a route handler answers the same on both lanes
        if: always()          # see the block above this job's steps
        run: tests/e2e/rust-http-lane-parity-gate.sh

      # WHERE a server binds, asserted from the OS with lsof rather than from a log line. `serve`
      # took a port and nothing else, so a .ssc service was LAN-reachable whether or not it was
      # meant to be (rozum, `serve-binds-all-interfaces`) — and the lanes did not even agree:
      # measured before the change, `run` bound 127.0.0.1 while `--v1` and `build-rust` bound `*`.
      # SSC_HTTP_BIND is now read by all three, TLS paths included, and an unresolvable value stops
      # the server instead of binding wider than asked. Each lane keeps its default; that divergence
      # is a product decision and is filed, not decided here. ~60 s, one cargo build.
      - name: a server binds where it was told, on every lane
        if: always()          # see the block above this job's steps
        run: tests/e2e/http-bind-address-gate.sh

      # `String.length` answered BYTES on this lane while `substring`/`charAt` index UTF-16 code
      # units, so `s.substring(i, s.length)` PANICKED on any non-ASCII string — reported from rozum,
      # where one accented character in a served page killed the tokio worker and every request
      # after it answered `PoisonError`. The probe carries two discriminating numbers: `"aé·b"`
      # separates bytes from code units, `"a😀b"` separates code units from characters — the second
      # is what makes the intuitive `chars().count()` repair fail here rather than in production.
      # The last row keeps a Vec's `.length` as its element count. ~30 s, one cargo build.
      - name: String.length is the same unit on every lane
        if: always()          # see the block above this job's steps
        run: tests/e2e/rust-string-length-gate.sh

      # `std/http.ssc` declares `handler: Request => Response` and the docs write it inline, but the
      # target chooser read only the lambda's PARAMETER ANNOTATION — so `req => Response(404, …)`,
      # and the block form `route(m, p) { req => … }` with it, went to the plain-String entry and
      # rustc refused the crate. The fix keys off what the BODY proves, which is forced: the
      # chooser's own comment asks that an untyped lambda keep receiving the string it always has,
      # so the last two rows are controls, not symmetry — they fail if a working program's handler
      # quietly changed what it is handed. Rows are read off the EMITTED crate, because only the
      # entry name says which surface was chosen; one row then answers 404 on a real socket, which
      # is the reported symptom. ~90 s, four cargo builds.
      - name: a Response handler takes the Request entry however it is spelled
        if: always()          # see the block above this job's steps
        run: tests/e2e/rust-route-handler-shapes-gate.sh

      # A method in a `case class` body reached the emitter as an ordinary top-level def — the
      # collection is a DEEP `.collect`, and a class body is just more tree — so it came out as a
      # free fn whose field reads bound to nothing: two Ints and one method did not compile. The
      # rows run the program on all three lanes and compare ANSWERS, because a method that reads the
      # WRONG field compiles perfectly well. The no-method row is the anti-row: it carries the shape
      # almost every case class in the corpus has, and a revert must not move it. ~60 s, three cargo
      # builds. The corpus-wide control is `rust-std-survey-gate.sh`, already in this job.
      - name: a case-class method can read its own fields and call its siblings
        if: always()          # see the block above this job's steps
        run: tests/e2e/rust-case-class-method-gate.sh

      # `map + (k -> v)` reached rustc as an ADDITION — E0369 — and `std/http.ssc`'s `withHeader` is
      # written exactly that way, so no builder chain compiled on this lane. The lowering was never
      # missing, only unreachable: `.updated(k, v)` a few arms below renders the same operation. The
      # third row is the one that matters — the original map must be UNCHANGED, and a lowering that
      # inserted into the receiver rather than a clone would pass the first two and corrupt every
      # caller that kept it. Two anti-rows keep `"x" + "y"` and `1 + 2` where they were, since this
      # arm now sits in front of `+` for everything else. The wire row is the payoff: a header set
      # through the builder chain actually arrives. ~60 s, two cargo builds.
      - name: map + (k -> v) is a Map update, and the header it sets reaches the wire
        if: always()          # see the block above this job's steps
        run: tests/e2e/rust-map-plus-pair-gate.sh

      # WIRED 2026-08-13, having been invoked by NOTHING since it was written. The only reference to
      # it was a sentence in a sibling gate, which `no-orphan-gates` counted as a caller until that
      # was fixed — and `scljet-jdbc-facade-bytecode-class-too-large` names this script in its `gate:`
      # field, so the board claimed coverage from a script that never ran.
      #
      # It asserts BOTH directions of the `--bytecode` fallback marker: a program that genuinely
      # compiles must print no marker, and a fallback must announce itself — a silent one made
      # `bc-parity-sweep` diff the VM against ITSELF and record `identical`. 53 s measured locally,
      # which is why it lands here and not in the smoke suite that just shed two gates of that size.
      - name: bytecode fallback stays visible
        if: always()          # see the block above this job's steps
        run: tests/e2e/bytecode-fallback-visible.sh

      - name: Launcher input digest
        if: always()          # see the block above this job's steps
        run: tests/e2e/launcher-digest-gate.sh

  conformance:
    name: Conformance shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # SHARDED 2026-07-28 (build-ram-budget-and-speed). This job IS the per-push verdict path, and it
    # was the reason there was no verdict.
    #
    # MEASURED on run 30305919516 — the last ci.yml run that reached completion at all:
    #   Conformance Suite         37.7 min
    #     └ Run conformance tests 33.6 min   ← 89 % of the job, one sequential 345-case pass
    # Measured alongside it: the push interval on `main` is ~3-7 min. GitHub keeps at most one
    # pending run per concurrency group, so a 38-minute job means ~1 commit in 10 is ever tested and
    # the rest are superseded. Of the last 100 ci.yml runs: 83 cancelled, 4 failure, 0 success.
    # That is not a slow gate, it is an absent one — and `cancelled` reads as RED (MILESTONES.md),
    # so the apparatus was manufacturing reds for commits that were fine.
    #
    # Four round-robin shards turn 33.6 min of sequential cases into ~8.5 min of parallel ones, so
    # the verdict path goes ~37.7 -> ~13 min and roughly triples the fraction of commits that get a
    # verdict. Round-robin (idx % 4), not contiguous blocks: the corpus is name-sorted and the slow
    # cases cluster by name. The union property is not assumed — `tests/e2e/build-conformance-shard-gate.sh`
    # in the Validate job byte-compares the union of the four shard listings against the unsharded
    # one on every push.
    #
    # fail-fast: false so one red shard still lets the others report; a partial verdict is what made
    # the corpus-contract timeout unreadable for 13 runs.
    # ── TIER 2. NOT on push: this workflow has no `push:` trigger — see `on:` at the top. ─────
    # These three job headers said "runs on EVERY push" until 2026-08-13, and that stopped being
    # true on 08-01 when the trigger was deleted (the paragraph in `on:` explains why). A comment
    # claiming a job runs more often than it does is how "wired" quietly becomes "wired and never
    # runs" — the state `v1-jit-size.sh` sat in for a month, and the reason the gate wired into this
    # job below warns you to check the `on:` and the `if:` yourself.
    # It was taken off push on 2026-07-30 because the push path had no verdict at all — 83 of 100
    # runs cancelled — and smoke.yml became the per-push signal. Two things changed since, and
    # together they make this affordable again: the conformance job is a 4-way shard (~13 min, not
    # 37.7), and the push concurrency group now CANCELS in progress, so the tier costs one run at a
    # time instead of one per push. smoke.yml is still the fast first word; this is the verdict.
    #
    # GREEN BY CONSTRUCTION is what makes this a DEFAULT check rather than a nag: as of
    # ced13b729 the corpus is 353/353 with 10 `known-red:` lanes, each naming its BUGS slug and its
    # expiry. A known-red that starts passing FAILS the suite, so a declaration cannot outlive its
    # bug — which is the property a default-green tier needs and `status: fixed` does not have.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # Was 45m for the whole unsharded suite. A shard is ~1/4 of the case cost plus the same fixed
    # ~5 min of setup+assembly, so ~13 min expected. 25m is a guard with headroom, NOT the operating
    # point — if a shard starts approaching it, look at per-case cost, do not raise this. Raising the
    # cap instead of reading the growth is exactly how the corpus contract went 13 runs with zero
    # green (see corpus-contract.yml).
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Scala CLI
        uses: VirtusLab/scala-cli-setup@v1
        with:
          power: true
          jvm: temurin:21

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Verify dev installer worktree isolation
        run: tests/e2e/install-worktree-submodule-guard.sh

      - name: Cache Coursier/sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      # Compiled classes + zinc analysis: without this every CI run recompiles
      # all ~259 modules from scratch (the 90-min budget is mostly compilation).
      # Keyed by commit SHA so a push reuses the nearest previous build via
      # restore-keys and zinc recompiles only what changed.
      #
      # RESTORE-ONLY here + save-only-on-success at the end of the job (see
      # "Save compiled classes"). The old unified actions/cache@v4 re-saved the
      # cache even when the build FAILED, so a single build that failed midway
      # through compiling crypto-spi cached a partial/stale `classes` dir; zinc
      # then marked crypto-spi up-to-date on every later run and skipped it,
      # leaving dependents unable to resolve scalascript.crypto.* — a poison
      # that self-perpetuated for 200+ red runs. Never caching a failed build
      # breaks that loop; the `-v2-` prefix discards the already-poisoned caches.
      - name: Restore compiled classes (zinc)
        uses: actions/cache/restore@v4
        with:
          path: |
            **/target/scala-*/classes
            **/target/scala-*/test-classes
            **/target/scala-*/zinc
            **/target/streams
          # Per-job prefix (…-v2-conf-, disjoint from the sbt job's …-v2-sbt-).
          # The two jobs compile with different sbt invocations (install.sh
          # cli/installBin vs `sbt compile cli/assembly`), so their zinc analyses
          # are NOT interchangeable — sharing a cache let one job restore the
          # other's stale crypto-spi classes (zinc marked them up-to-date and
          # skipped recompiling), re-creating the "not a member of scalascript.crypto"
          # poison. Keeping the prefixes disjoint stops the cross-contamination.
          key: ${{ runner.os }}-classes-v2-conf-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-${{ github.sha }}
          # Include the build.sbt hash: zinc doesn't detect `dependsOn`/module-graph
          # changes, so restoring a classes cache built under a different build.sbt
          # serves stale upstream classes (the "value X is not a member of scalascript"
          # poison). Keying by build.sbt forces a clean cold rebuild whenever the
          # module graph changes, and reuses the cache only within a stable graph.
          restore-keys: |
            ${{ runner.os }}-classes-v2-conf-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-

      - name: Build ssc launcher (sbt-assembly)
        run: bash install.sh --dev

      - name: Verify staged launcher bytes are reproducible
        run: tests/e2e/staged-launchers-clean.sh

      # backendRust's own tests, on shard 1 only — they are not sharded, and running them four
      # times would cost 4x for one verdict.
      #
      # WHY THIS STEP EXISTS. Nothing on the PUSH path runs them: the smoke suite may not invoke
      # sbt (its own rule, `scripts/smoke-ci.ssc` §"A CHECK NEVER BUILDS"). On 2026-08-09 that let
      # a WRONG-CODE regression through — omitted default arguments dropped from generated calls,
      # `greet("hi")` instead of `greet("hi", "!", false)` — and it survived every push. A sibling
      # working in the same file found it; no gate did. This job runs every four hours, so that
      # defect now has a four-hour half-life instead of an indefinite one.
      - name: Run backendRust tests
        if: matrix.shard == 1
        run: sbt -batch backendRust/test

      # The std corpus through build-rust: 131 modules, ~5 minutes, so it belongs here rather than
      # on the push path. It asserts ONE thing — that no module moves from REFUSED to BADRUST, i.e.
      # that a lowering never starts emitting Rust rustc rejects where it used to say plainly that
      # it could not lower. 57% of std is honestly refused and that is a roadmap, not a failure.
      #
      # The corpus is the standard library, so this needs no fixtures and cannot go stale against
      # the language. It came from rozum's survey — the first time anyone had put std through this
      # lane at all, which is also how five of their six defect reports were found.
      - name: Run the std/rust survey (BADRUST must not grow)
        if: matrix.shard == 1
        run: tests/e2e/rust-std-survey-gate.sh

      - name: Run conformance tests (shard ${{ matrix.shard }}/4)
        # Warm JVM lane (specs/conformance-perf.md F3): reuse one Bloop build
        # server across cases instead of a cold scalac start per case. The
        # per-case cold compile is the dominant conformance cost; the INT/JS
        # lanes already batch (F4) but the JVM lane did not. Correctness is
        # unchanged (same `scala-cli run`, warm compiler). run.sc keeps the
        # server tree bounded and kills it on shutdown. Revert this env to fall
        # back to the serverless (cold, more robust) default.
        env:
          SSC_CONF_WARM_JVM: '1'
        # The `--` is load-bearing: without it scala-cli claims `--shard` as its own flag and dies
        # with "Unrecognized argument" before the script starts (the same trap documented in
        # corpus-contract.yml).
        run: scala-cli tests/conformance/run.sc -- --shard ${{ matrix.shard }}/4

      # Save the classes/zinc cache ONLY when every step above succeeded, so a
      # failed build can never poison later runs (the 200-run red streak cause).
      #
      # Only shard 0 writes. All four shards produce an equivalent build from the same SHA, and
      # `actions/cache/save` on an existing key is a wasted upload of the same ~GB four times over;
      # one writer also keeps the "never save a failed build" invariant easy to reason about.
      - name: Save compiled classes (zinc)
        if: success() && matrix.shard == 0
        uses: actions/cache/save@v4
        with:
          path: |
            **/target/scala-*/classes
            **/target/scala-*/test-classes
            **/target/scala-*/zinc
            **/target/streams
          key: ${{ runner.os }}-classes-v2-conf-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-${{ github.sha }}

  # Everything the old single Conformance Suite job did BESIDES the corpus run. Split out for one
  # reason: these steps are ~1 min of work that does not shard, and leaving them inside the matrix
  # would have run them four times for no added coverage. As a sibling job they overlap the shards
  # entirely, so they cost zero wall clock on the verdict path.
  conformance-extras:
    name: Examples and launcher smokes
    runs-on: ubuntu-latest
    # ── TIER 2. NOT on push: this workflow has no `push:` trigger — see `on:` at the top. ─────
    # These three job headers said "runs on EVERY push" until 2026-08-13, and that stopped being
    # true on 08-01 when the trigger was deleted (the paragraph in `on:` explains why). A comment
    # claiming a job runs more often than it does is how "wired" quietly becomes "wired and never
    # runs" — the state `v1-jit-size.sh` sat in for a month, and the reason the gate wired into this
    # job below warns you to check the `on:` and the `if:` yourself.
    # It was taken off push on 2026-07-30 because the push path had no verdict at all — 83 of 100
    # runs cancelled — and smoke.yml became the per-push signal. Two things changed since, and
    # together they make this affordable again: the conformance job is a 4-way shard (~13 min, not
    # 37.7), and the push concurrency group now CANCELS in progress, so the tier costs one run at a
    # time instead of one per push. smoke.yml is still the fast first word; this is the verdict.
    #
    # The examples-on-three-backends pass and the launcher smokes are exactly the coverage a
    # smoke suite cannot carry, and at 14.1 min they run alongside the conformance shards rather
    # than after them, so they cost no extra wall clock on this tier.
    # 30, and REMOVING the audit was not enough on its own. Measured on the 2026-08-15 nightly:
    # 1228 s spent before the timeout, of which the audit was 737 s — so the 18 steps that did run
    # cost ~491 s, and this job's own header documents ~11 further minutes for the 17 orphan gates
    # that were being skipped. 491 + 660 + the 246 s build lands ON the old 20-minute line, which
    # is how a job "fixed" by deleting one step goes straight back to `cancelled`.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Scala CLI
        uses: VirtusLab/scala-cli-setup@v1
        with:
          power: true
          jvm: temurin:21

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Verify dev installer worktree isolation
        run: tests/e2e/install-worktree-submodule-guard.sh

      - name: Cache Coursier/sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      # Restore-only, sharing the conformance job's prefix: this job runs the same `install.sh --dev`
      # invocation as the shards, so their zinc analyses ARE interchangeable (unlike the sbt job's —
      # see the note on that job's restore step). It never SAVES, so it cannot poison the prefix.
      - name: Restore compiled classes (zinc)
        uses: actions/cache/restore@v4
        with:
          path: |
            **/target/scala-*/classes
            **/target/scala-*/test-classes
            **/target/scala-*/zinc
            **/target/streams
          key: ${{ runner.os }}-classes-v2-conf-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-classes-v2-conf-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-

      - name: Build ssc launcher (sbt-assembly)
        run: bash install.sh --dev

      - name: Verify staged launcher bytes are reproducible
        run: tests/e2e/staged-launchers-clean.sh

      - name: Integer-literal fail-open regression (assembled launchers, both backends)
        run: tests/e2e/int-literal-failopen-smoke.sh

      - name: Scala-fence width parity (W5 guard — scala fence == scalascript fence on every lane)
        run: tests/e2e/scala-fence-width-parity-smoke.sh

      # Can a gate FAIL at all? Replaces the launchers with a stub that records its call and exits
      # 1, then runs every WIRED gate: one that invokes the stub must go red. Measured 2026-08-13 —
      # 105 invoke a launcher, 91 fail with it, 14 decline by design and are declared by name.
      #
      # HERE and not on the push path: ~20 minutes. This job is tier 2 (no `if:`, and ci.yml runs on
      # pull_request + the nightly schedule), and it already builds a launcher, which is the one
      # thing the check needs. Cadence checked rather than assumed — v1-jit-size was once wired into
      # the `sbt` job, which is workflow_dispatch-only, and ran essentially never.
      #
      # Its verdict is reproducible only because a blind candidate is re-verified ALONE before being
      # classified: inside the sweep, gates that share a hard-coded port answer each other's
      # requests. See tests/BUGS.md wired-gates-share-hard-coded-tcp-ports.
      # ── 17 gates that were invoked by NOTHING, drained here ─────────────────────────────────────
      #
      # Each was RUN against a freshly built launcher (2026-08-13) and passed; the measured cost is
      # on each line, and it is what put them HERE rather than in smoke — they total ~11 minutes and
      # smoke was already at 765 s of a 1027 s budget. This job is tier 2 (no `if:`, ci.yml runs on
      # pull_request + the nightly schedule) and it builds a launcher, which they need.
      #
      # Each was also checked NOT to be vacuous: re-run with the launcher replaced by a failing
      # stub, all of them go red — except `f-char-escape`, which SKIPS by design
      # (`ssc_usable_or_skip`) and is therefore declared in no-orphan-gates.sh. It is wired here and
      # nowhere else precisely because this job guarantees a launcher; on a host without one it
      # would report success having tested nothing.
      # (orphaned-e2e-gates-52.)
      - name: pattern-undefined-name (12s, was an orphan)
        run: tests/e2e/pattern-undefined-name-gate.sh
      - name: member-beats-toplevel (18s, was an orphan)
        run: tests/e2e/member-beats-toplevel-gate.sh
      - name: components-smoke (24s, was an orphan)
        run: tests/e2e/components-smoke.sh
      - name: middleware-smoke (24s, was an orphan)
        run: tests/e2e/middleware-smoke.sh
      - name: health-defaults-smoke (25s, was an orphan)
        run: tests/e2e/health-defaults-smoke.sh
      - name: import-parse-error (25s, was an orphan)
        run: tests/e2e/import-parse-error-gate.sh
      - name: fm-routes-smoke (26s, was an orphan)
        run: tests/e2e/fm-routes-smoke.sh
      - name: int-imported-registry (30s, was an orphan)
        run: tests/e2e/int-imported-registry-gate.sh
      - name: jvm-json-import (34s, was an orphan)
        run: tests/e2e/jvm-json-import-gate.sh
      - name: multi-name-val (35s, was an orphan)
        run: tests/e2e/multi-name-val-gate.sh
      - name: f-front-delegation-visible (36s, was an orphan)
        run: tests/e2e/f-front-delegation-visible.sh
      - name: object-var-mutation (42s, was an orphan)
        run: tests/e2e/object-var-mutation-gate.sh
      - name: triple-quote-trailing-quote (42s, was an orphan)
        run: tests/e2e/triple-quote-trailing-quote-gate.sh
      - name: f-char-escape (44s, was an orphan)
        run: tests/e2e/f-char-escape-gate.sh
      - name: validation-smoke (76s, was an orphan)
        run: tests/e2e/validation-smoke.sh
      - name: upload-smoke (84s, was an orphan)
        run: tests/e2e/upload-smoke.sh
      - name: no-paren-sibling (180s, was an orphan)
        run: tests/e2e/no-paren-sibling-gate.sh

      # ── batch 3: three more, and each is here for a measured reason ──────────────────────────────
      #
      # ONE MECHANICAL CAUSE explained three of the sixteen that were failing: they set BIN to the
      # STANDARD bin/ssc and drive `--v1`, which that tier refuses by design ("run ssc-tools
      # explicitly"). Both lanes then came back empty and the gate reported "--v1 baseline broke" —
      # a false accusation against v1. One word each; two are green and wired here.
      # The third, serve-view-frontend-v2-smoke, is NOT wired: the fix revealed a real v2 defect
      # underneath (--v1 http=200, --v2 http=000), filed as
      # v2-lane-does-not-serve-the-content-introspection-view.
      #
      # selfhost-front-gate was never broken at all. It takes 289 s and the census cap was 180, so it
      # was recorded as failing when it had simply been cut off. A timeout is not a verdict.
      # (orphaned-e2e-gates-52.)
      - name: route-params-v2-smoke (33s, was an orphan reporting a false baseline failure)
        run: tests/e2e/route-params-v2-smoke.sh
      - name: req-type-collision-v2-smoke (34s, same cause)
        run: tests/e2e/req-type-collision-v2-smoke.sh
      - name: selfhost-front (289s — never broken, only ever cut off at a 180s cap)
        run: tests/e2e/selfhost-front-gate.sh

      # ── batch 4, and the finding is about the gate, not the product ─────────────────────────────
      #
      # install-sh-reports-failure-gate guards scripts/BUGS.md
      # `install-sh-exits-0-when-sbt-project-load-fails` — install.sh must not report success for a
      # build that produced nothing. The witness is intact. What had broken is that the gate could
      # no longer REACH it: the toolchain cache landed in install.sh on 2026-08-09, three days after
      # the gate, and on a digest HIT it restores bin/lib and skips `sbt cli/installBin` entirely.
      # Row 2 then read the cache's exit 0 as "the defect is back" (false red) and row 1 passed
      # because a LATER `sbt-plugin publishLocal` failed instead (false green, right answer, wrong
      # command). Both rows now run with the cache off, assert they reached the build path before
      # returning any verdict, and assert the MECHANISM string rather than the sign of the exit
      # code. Proven by deleting the witness from install.sh: row 2 goes red, row 1 stays green.
      # (orphaned-e2e-gates-52.)
      - name: install-sh refuses to report success for a build that produced nothing (2s)
        run: tests/e2e/install-sh-reports-failure-gate.sh

      # Orphan drain, batch 4 part 3: this one was RED and SILENT — twenty bare `grep … >/dev/null`
      # under `set -e`, so its failure was an exit code with no output and a deleted sandbox. Made to
      # speak, it named a real defect: a jar built from a SIX-LINE program advertised
      # `SourceFile: "json.ssc"` and all 29 of its stack frames named the std library, none the file
      # its author wrote. The JVM stores one SourceFile per class and prints it on every frame, so
      # file 1 of the SMAP decides what every crash report says. `RunNativeV2` injects the ambient
      # prelude as LEADING roots and the source map took file 1 = first explicit root, which is the
      # prelude. Fixed by separating `userRoot` from `explicitRoot`.
      # (tests/BUGS.md jvm-artifact-stack-trace-never-names-the-users-own-file.)
      - name: build-jvm artifacts carry honest debug metadata (26s, was a silent red orphan)
        run: tests/e2e/v21-build-jvm-smoke.sh

      # Orphan drain, batch 4 part 4 — the ONE shared mechanical cause of that batch, and it
      # explained both of these: they drove `scala-cli run "$ROOT/compiler" --main-class
      # scalascript.cli.ssc`, an sbt project that no longer exists, with stderr sent to /dev/null,
      # and `ROOT` was one `..` short as well. So every assertion ran against the EMPTY STRING:
      # actors-pingpong reported all three backends producing nothing, wc-card missed all nine
      # needles. One dead command reads as nine product defects.
      #
      # Pointed at bin/ssc-tools, both pass first try — there was no product defect underneath
      # either of them. Two expectations were corrected with evidence rather than to make them pass:
      # the `[exit] actor=3 reason=kill` line has no producer anywhere in the tree (the program
      # never traps or links, so nothing should print), and the JS arm's `[object Object]`
      # substitution is gone because that divergence is FIXED — all three lanes now print `None` and
      # `Some(...)`, which makes one expectation for three lanes the stronger assertion.
      # (tests/BUGS.md orphaned-e2e-gates-52.)
      - name: actors ping-pong agrees on INT, JS and JVM (13s, was an orphan on a dead runner)
        run: tests/e2e/actors-pingpong-smoke.sh
      - name: emit-wc bundle has the expected shape (2s, same cause)
        run: tests/e2e/wc-card-smoke.sh

      # Orphan drain: this gate ENCODED A DEFECT THAT WAS LATER FIXED. Its `curried-three-clauses`
      # case required the message `cannot unify tuple: () vs (Int -> t6)` from `def tri(a)(b)(c)`,
      # a program that was expected to fail type checking — and
      # `v2-three-parameter-clauses-fail-typecheck` is status:fixed (6d0066d14), so the program now
      # prints 6 and the case asserted an error that no longer exists.
      #
      # The author predicted exactly this and then wrote the opposite: the note above the case said
      # the row was "the generic one rather than this specific text", and the row was the specific
      # text. A comment cannot hold an invariant. Every case now asserts the generic shape — a name,
      # a colon, two sides around ` vs ` — and no case depends on a program staying broken. The
      # self-test tests the MATCHER on literal text in both directions, so it cannot rot the same way.
      # (tests/BUGS.md orphaned-e2e-gates-52.)
      - name: type errors name both types (11s, was an orphan asserting a fixed defect)
        run: tests/e2e/typeerr-names-both-types.sh --self-test

      # TYPES MUST BE RIGHT, the native slice. A declared parameter type is now a CONSTRAINT on this
      # lane: `def f(a: Int); f("x")` is rejected, where it used to print `x`. The checker never saw
      # the annotation before, because the native tier has TWO parsers and only the lowerer's keeps
      # types — ssc1-front.ssc0 erases them with skipTypeAnnot and the checker imports that front.
      #
      # The gate pins the EDGES as well as the middle: a `Double` parameter and a generic one are
      # outside the recognised set (Int|String|BigInt in the simple position, the same boundary F
      # draws) and must still be ACCEPTED. If they start being rejected, the set widened without the
      # consumer census that widening needs — scripts/BUGS.md records that Long could not be added
      # to knownTyName without one, and that the failure mode is a silent coverage loss.
      #
      # Measured cost of turning it on: ZERO of 399 conformance cases, 148 of which declare a
      # parameter in the recognised form. (tests/BUGS.md no-two-type-checkers-in-this-repo-agree.)
      - name: a declared parameter type is a constraint (12s, native lane)
        run: tests/e2e/declared-type-is-a-constraint.sh

      - name: Run examples on all three backends
        run: scala-cli examples/run-all.sc

      - name: Type-check examples (ssc-tools check)
        run: |
          ./bin/ssc-tools check examples/*.ssc

      # LAST in this job on purpose: it asks whether anything this project started is still
      # listening, and that is only meaningful once the things that start servers have finished.
      #
      # CI ONLY, and not smoke. On a dev machine a sibling agent's live test is a listening server
      # indistinguishable from a leak; on an isolated runner the reading is exact. Measured
      # 2026-08-13: two `target/debug/ssc_program` processes were still listening on 8493 and 8497
      # hours after their test, from the RUST lane — not from any gate, which is why the first
      # version of the check (ports enumerated out of tests/e2e sources) reported PASS while looking
      # straight at them. (wired-gates-share-hard-coded-tcp-ports.)
      - name: No server outlives its test
        if: always()
        run: tests/e2e/no-leaked-servers.sh --self-test


  gate-evidence-audit:
    name: Every wired gate can fail (stub-launcher audit)
    runs-on: ubuntu-latest
    # ── ITS OWN JOB, because inside `conformance-extras` it STARVED the other 33 steps. ──────────
    #
    # Measured on the 2026-08-15 nightly: this one step took 737 s of that job's 20-minute budget —
    # 60% of it — and with the 246 s launcher build ahead of it the job hit `timeout-minutes: 20`
    # every single run. A GH job timeout surfaces as `cancelled`, not `failure`, which is why it
    # read as an infrastructure hiccup rather than as "28 of 47 steps never ran".
    #
    # The audit is expensive BY DESIGN: it re-verifies every blind candidate ALONE against a stub
    # launcher, which is what makes its verdict reproducible. That cost is worth paying — but not
    # out of the same 20 minutes as 33 unrelated gates. Jobs run in parallel, so moving it here
    # costs no wall-clock and gives both halves a budget they fit in.
    # 40, and the first number was measured wrong — worth recording because the error is instructive.
    # Inside `conformance-extras` this audit took 737 s, so 25 looked generous. Run ALONE it took
    # 1193 s, and with its own 263 s launcher build the job hit the cap at ~24.3 min and was
    # CANCELLED on its first outing. A step's cost inside a warm job is not its cost in a cold one,
    # and the audit re-verifies every blind candidate individually, so it scales with what it finds.
    # A generous cap here is free: the job runs in parallel with everything else.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Scala CLI
        uses: VirtusLab/scala-cli-setup@v1
        with:
          power: true
          jvm: temurin:21

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Verify dev installer worktree isolation
        run: tests/e2e/install-worktree-submodule-guard.sh

      - name: Cache Coursier/sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      # Restore-only, sharing the conformance job's prefix: this job runs the same `install.sh --dev`
      # invocation as the shards, so their zinc analyses ARE interchangeable (unlike the sbt job's —
      # see the note on that job's restore step). It never SAVES, so it cannot poison the prefix.
      - name: Restore compiled classes (zinc)
        uses: actions/cache/restore@v4
        with:
          path: |
            **/target/scala-*/classes
            **/target/scala-*/test-classes
            **/target/scala-*/zinc
            **/target/streams
          key: ${{ runner.os }}-classes-v2-conf-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-classes-v2-conf-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-

      - name: Build ssc launcher (sbt-assembly)
        run: bash install.sh --dev


      - name: Every wired gate can fail (stub-launcher evidence audit)
        run: tests/e2e/no-orphan-gates.sh --evidence

  uniml:
    name: UniML — standalone build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # WHY THIS JOB EXISTS AND WHY IT IS NOT IN SMOKE. Until 2026-08-04
    # `grep uniml .github/workflows/` returned nothing: ten UniML projects and
    # ~300 tests were run by no automated gate at all. The obvious home looked
    # like `smoke-ci`, and that was tried and reverted — a smoke check CONSUMES
    # the staged toolchain and never builds one, `Setup sbt` there is conditional
    # on a cache MISS, and UniML ships in no staged artefact for a check to
    # consume. The contract is written down in `scripts/smoke-ci.ssc`.
    #
    # THE COST, stated rather than buried: this repository pushes straight to
    # `main`, so `pull_request` rarely fires and in practice this job is the
    # NIGHTLY. A UniML regression is caught in hours, not in the minutes a push
    # gate would give. That is the honest price of a module that ships nothing;
    # the alternative was putting a Part III library into the default
    # distribution, which §7 invariant 1 of specs/project-partitioning.md
    # forbids on purpose.
    #
    # It runs the STANDALONE build deliberately, not `unimlScala/test` in the
    # root one. That build is UniML's own proof it stands alone — zero
    # dependency on the ScalaScript trees — so one command checks the tests and
    # that property together. Measured: 27.9 s from clean on a warm dependency
    # cache here; the 20 min cap is for a cold runner with none.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Cache Coursier/sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-uniml-sbt-${{ hashFiles('uniml/build.sbt', 'uniml/project/*.sbt', 'uniml/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-uniml-sbt-

      - name: Standalone build and tests
        working-directory: uniml
        # The aggregate reports one line per project. A build that quietly
        # stopped aggregating would still exit 0 while testing LESS, so the
        # count is asserted — that is the failure an exit code cannot see.
        run: |
          set -euo pipefail
          sbt -batch test | tee /tmp/uniml.log
          passed=$(grep -c "All tests passed" /tmp/uniml.log || true)
          echo "UniML: $passed project(s) reported passing"
          # EXACT, not a floor, and the change is the point. This was `-lt 10`
          # against an aggregate that had grown to 15: five projects were added
          # on 2026-08-06/07 (markupCore, unimlXml, unimlAddress and the two JS
          # siblings) and nobody moved the number, so the check tolerated losing
          # a THIRD of the module in silence. A floor only ratchets when someone
          # remembers to ratchet it, and measured here, nobody did.
          #
          # Equality makes staleness impossible instead of merely unlikely:
          # losing a project goes red, and ADDING one also goes red until this
          # line is bumped in the same commit. That is one line of friction
          # bought against a check that had quietly stopped checking.
          #
          # Deriving the count from `.aggregate(...)` was tried and rejected on
          # purpose: the failure this guards against is a project dropping OUT
          # of that list, and an expectation read from the same list falls with
          # it and stays green. The expectation has to be frozen somewhere the
          # sabotage cannot reach.
          #
          # 15 == measured, `cd uniml && sbt -batch test`, 103 s, exit 0.
          expected=15
          if [ "$passed" -ne "$expected" ]; then
            echo "::error::UniML: $passed project(s) reported passing, expected exactly $expected."
            echo "::error::Fewer means the aggregate silently stopped testing something."
            echo "::error::More means a project was added — bump 'expected' in this step."
            exit 1
          fi

  sbt:
    name: sbt — compile and release gates
    runs-on: ubuntu-latest
    # NOT on push. MEASURED 2026-07-28 over 6 hours on `main` (BUGS.md
    # `ci-sbt-job-is-28x-the-code-push-interval`): 51 code pushes, mean interval 7 min, while this
    # job takes 196 min — a ratio of 28. With GitHub's one-pending-run-per-group rule, at most 1
    # commit in 28 could ever reach a verdict, so for the other 27 the per-push signal was not slow,
    # it was ABSENT — and `cancelled` reads as RED (MILESTONES.md), so the apparatus was manufacturing
    # reds for commits that were fine.
    #
    # Queue policy cannot fix that ratio; `paths-ignore` removed 74% of the load and left it
    # unchanged, because it was never the docs commits. Either the verdict-carrying job gets shorter
    # than the push interval, or the per-push verdict comes from jobs that already are: measured
    # alongside it, Lint 28 s, Validate 34 s, Conformance Suite 38 min. Those three now ARE the
    # per-push verdict; this one runs on the 4-hourly schedule and on demand.
    #
    # THE COST, stated plainly rather than buried: a push no longer carries `sbt test`. A unit-test
    # regression now surfaces in the next scheduled batch, and attribution across ~28 intervening
    # commits is harder than a per-push red would have been. That is the trade the arithmetic forces;
    # the alternative on offer was not "per-push coverage" but "no verdict at all", which is what was
    # actually happening. Re-measure the ratio if `sbt test` gets faster (BACKLOG
    # `ci-crossbackend-differential-runtime`) — if it drops under the push interval, put it back.
    # ── ON DEMAND ONLY (2026-08-01, owner's call), like negtc above. ─────────────────────────
    # 152 min median, 4/10 green over the last ten full runs. It is the deepest coverage in the
    # repo and the least suited to a timer: a nightly of it costs ~150 runner-minutes to tell you
    # something you will read in the morning, about a commit you can no longer cheaply bisect.
    # Asked for instead — before a release, or when the change is in `sbt test` territory.
    if: github.event_name == 'workflow_dispatch'
    # JOB-level cap. This must exceed (prior gates + the full `sbt test` phase). Raised
    # ahead of the F4 default-front flip (v2-f4-reflip, 2026-07-22): when F becomes the
    # default the negtc release gate re-lowers the corpus through the slower F front, so its
    # step cap went 30->75 min (see that step's note; the flip LANDED 2026-07-26, 56d7d705f —
    # these budgets are now the live ones). Budget: prior gates ~65-90 min (incl. negtc up to 75) + `sbt test` >105
    # min observed (run 29712918894 hit the old 150-min JOB cap with the differential suites
    # still running; STEP cap raised to 200). Raised 240->300 generously to clear it in one
    # shot rather than guess-and-refail a multi-hour run; TUNE DOWN once F-perf (F5b) lands
    # and the true durations are observed. Real fix (fast/nightly cross-backend differential
    # suites, since v1 is crystallized): BACKLOG ci-crossbackend-differential-runtime.
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # node enables the interp==JS(node) leg of CrossBackendPropertyTest (the
      # cross-backend differential) under `sbt test`. Without it the test skips
      # via `assume(has("node"))`. The interp==JVM(scala-cli) leg stays gated and
      # is covered by the Conformance job; subprocess hangs are bounded by
      # ProcTestUtil.runCaptured, so a wedged child fails fast, not the whole job.
      #
      # node 24, not 20: `emit-wasm` output needs a modern V8 for TWO separate
      # reasons, and CI found them one at a time (node 20 -> 22 -> 24):
      #   1. it is a **WasmGC** module — node 20 gives
      #      `CompileError: Unknown type code 0x5e, enable with --experimental-wasm-gc`.
      #      The flag is NOT a portable workaround: modern node rejects it outright
      #      ("bad option") because WasmGC is standard there.
      #   2. its `__loader.js` instantiates with
      #      `{ builtins: ["js-string"], importedStringConstants: "" }` — the
      #      **imported string constants** proposal. 364 of the module's 484 imports
      #      have module name `""` and are satisfied by that option, so a V8 that
      #      ignores it (node 22) fails with
      #      `TypeError: Import #120 module="": module is not an object or function`.
      # So the requirement is a node whose V8 has WasmGC *and* JS string builtins.
      # This only surfaced now: the wasm target smoke had never run in CI (an earlier
      # step always failed first) and it passes on developers' newer local node.
      # Only this job runs that gate; the other two stay on 20 deliberately, to avoid
      # perturbing a green conformance lane.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      # `ssc-tools emit-wasm` shells out to scala-cli, so the wasm TARGET lane of the
      # explicit-lanes gate below needs it on PATH (its dependency_tier is literally
      # `wasm-target-tools`). Without it that gate died with
      # `Cannot run program "scala-cli"` — invisible for as long as the gate failed
      # earlier, on the mcp provider lane. This does NOT weaken the compiler-free
      # story: the negative-toolchain gate builds its own sandbox PATH and asserts
      # scala-cli is unreachable there, so it is unaffected by the tool existing on
      # the runner.
      - name: Setup Scala CLI
        uses: VirtusLab/scala-cli-setup@v1
        with:
          power: true
          jvm: temurin:21

      - name: Cache Coursier/sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      # Same classes+zinc cache as the conformance job: without it this job
      # recompiles all ~259 modules from scratch every run. Restore-only +
      # save-on-success (see the end of this job) — a failed build must never
      # re-save the cache, or a stale crypto-spi `classes` dir poisons every
      # later run (zinc skips crypto-spi → dependents can't see
      # scalascript.crypto.*). The `-v2-` prefix discards the poisoned caches.
      - name: Restore compiled classes (zinc)
        uses: actions/cache/restore@v4
        with:
          path: |
            **/target/scala-*/classes
            **/target/scala-*/test-classes
            **/target/scala-*/zinc
            **/target/streams
          key: ${{ runner.os }}-classes-v2-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-${{ github.sha }}
          # ONLY this job's own prefix — do NOT fall back to the conformance job's
          # …-v2-conf- cache: their zinc analyses are incompatible and sharing
          # re-poisons crypto-spi (see the conformance Restore step's note).
          # See the conformance job's note — key by build.sbt hash so a module-graph
          # change cold-rebuilds instead of restoring stale classes (poison).
          restore-keys: |
            ${{ runner.os }}-classes-v2-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-

      # installBin stages bin/lib/compiler/jars — the Scala compiler jars that
      # `compile-jvm --bytecode` / `link` load lazily via ssc.lib.path. The CLI
      # subprocess smoke tests (EmitScalaFacadeCliTest, link-tier tests) walk up
      # from the assembled jar to find them; without staging they fail with
      # "CompilerLoader: ssc.lib.path is not set".
      - name: Compile and assemble ssc.jar
        run: sbt compile cli/assembly installBin

      # Runs HERE, right after the build, because it needs compiled v2 classes and nothing
      # else. It is ~5 seconds. A method whose bytecode passes -XX:HugeMethodLimit (8000) is
      # never JIT-compiled by HotSpot and runs interpreted forever, with no warning and no
      # behavioural difference — so NO correctness gate can see it, and none did: `Prims`'s
      # `__method__` dispatch sat at 49,384 bytecodes until 2026-07-28, making every method
      # call in every ScalaScript program interpreted. Splitting it was worth 2.4-10.8x.
      # --self-test asserts both verdicts (fires on a huge method, quiet on a small one),
      # because a detector only ever observed staying quiet is not a detector.
      - name: v2 runtime stays under HotSpot's HugeMethodLimit
        run: tests/e2e/v2-jit-size.sh --self-test

      - name: ScalaScript 2.1 compiler-free ASM artifact release gate
        run: tests/e2e/v21-build-jvm-release-gate.sh --report target/v21-build-jvm-release.tsv

      - name: ScalaScript 2.1 explicit provider and target lanes
        run: tests/e2e/v21-explicit-lanes-gate.sh --report target/v21-explicit-lanes.tsv

      # MCP left the explicit-lanes manifest when it joined the standard graph (2026-07-31). That
      # manifest was the only thing invoking its smoke, so the gate is wired here explicitly —
      # otherwise the rename would have silently dropped MCP from CI altogether.
      - name: ScalaScript 2.1 MCP on the standard launcher
        run: tests/e2e/v21-standard-mcp-smoke.sh

      # NFC left the explicit-lanes manifest the same day and for the same reason as MCP, so its
      # smoke needs the same explicit wiring — the manifest was the only thing invoking it.
      - name: ScalaScript 2.1 NFC on the standard launcher
        run: tests/e2e/v21-standard-nfc-smoke.sh

      - name: ScalaScript 2.1 physically slim standard distribution gate
        run: tests/e2e/v21-slim-distribution-gate.sh --report target/v21-slim-distribution.tsv

      - name: ScalaScript 2.1 JRE-shaped no-javac module gate
        run: tests/e2e/v21-jre-module-gate.sh --report target/v21-jre-module.tsv

      # The standard-only negative toolchain release gate MOVED OUT 2026-07-31
      # (negtc-gate-shard-reduce) to the `negtc-map` / `negtc-reduce` jobs at the end of this file,
      # together with its long note about F wall time and the 75-minute ceiling. It was 3236 s of
      # this job on run 30597944542 and, being sequential, those 54 min sat in front of `Test via
      # sbt` (8088 s on the same run) — so the whole 208-min suite waited on them.

      - name: ScalaScript 2.1 direct-ASM local recursion gate
        run: tests/e2e/v21-direct-asm-recursion-smoke.sh

      # MOVED OFF THE PUSH PATH, 2026-08-11. At 121.5 s it was 16 % of the smoke suite, and smoke was
      # timing out: every cancelled run on main lived exactly 20 minutes against timeout-minutes: 20.
      # It belongs in this job rather than `validate` because it is the one check that needs sbt.
      - name: sbt plugin scripted tests
        run: tests/e2e/sbt-plugin-scripted.sh

      # MUST follow the step above: it publishes sbt-scalascript-interop to the local ivy repo, and
      # this one runs `sbt update` on a scaffolded project that resolves exactly that plugin. They
      # left smoke together for that reason -- splitting them on 2026-08-11 turned main red with
      # ResolveException / Not found, and nothing in a per-check timing table shows the coupling.
      - name: Scaffolded template resolves its build
        run: tests/e2e/scaffold-loads-its-build.sh

      # The full `sbt test` genuinely needs > 90 min: it is dominated by the
      # cross-backend differential suites that compile+run generated programs
      # through `scala-cli run --server=false` (cold per-program compile, for
      # isolation) and `node`. On run 29700272865 a single suite
      # (CrossBackendPropertyTest) took 44.7 min of the 90-min budget and the
      # whole test phase was still running when the 90-min hard cap fired — all
      # tests were passing, they just ran out of wall clock. The 150-min STEP cap
      # was NOT the binding constraint on run 29712918894 — the 150-min JOB cap was
      # (job = prior gates + this step). Both raised; STEP to 200 to cover the full
      # test phase, JOB (above) to 240 to cover prior gates + this step. TUNE DOWN
      # once the true duration is observed. See BACKLOG
      # (ci-crossbackend-differential-runtime) for the real optimization follow-up.
      # `Test via sbt` MOVED OUT 2026-08-02 to the `sbt-test` matrix at the end of this file.
      # It was 82.6 min after the eager-clue fix (106.5 before) against ~20 min for everything above
      # it, and the two ran SEQUENTIALLY, so this job was the suite's longest by a wide margin. The
      # gates stay here: each is ~1 min and sharding them would run every one four times for no
      # added coverage.

      # Save the classes/zinc cache ONLY when compile + assembly + tests all
      # passed, so a failed build can never poison later runs.
      - name: Save compiled classes (zinc)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            **/target/scala-*/classes
            **/target/scala-*/test-classes
            **/target/scala-*/zinc
            **/target/streams
          key: ${{ runner.os }}-classes-v2-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-${{ github.sha }}

  # ── the standard-only negative toolchain release gate, as MAP + REDUCE ──────────────────────────
  #
  # It used to be one step of the `sbt` job. MEASURED on run 30597944542 (the last one that reached
  # a verdict): 3236 s for the gate, then 8088 s for `Test via sbt`, sequentially, inside a 208-min
  # job — so every full run paid the gate's 54 min before the test phase could start.
  #
  # The gate itself cannot simply be sharded: after its two corpus sweeps it runs the sentinel and
  # runtime taxonomies against FROZEN WHOLE-CORPUS counts, and a partial report drifts every metric.
  # The split is therefore map/reduce, and the mode flags for it landed 2026-07-30:
  #
  #   MAP     --sweeps-only --shard i/N   only the two sweeps over slice i; no taxonomy, no freeze,
  #                                       no assertions, and deliberately no --strict (a shard's
  #                                       strict verdict would be about a slice)
  #   REDUCE  --reduce                    skips the sweeps, runs taxonomy + freeze + the negative
  #                                       assertions + the metric report ONCE on merged reports
  #
  # `tests/e2e/negtc-mapreduce-gate.sh` proves the property this rests on — map+merge over N shards
  # is byte-identical to one unsharded sweep. Without it a sharded release gate would report a
  # verdict about something other than the corpus, and it would do so GREEN.
  #
  # WHAT IS NOT MEASURED, stated rather than implied: the gate emits nothing between its start and
  # its final summary (verified on run 30635743363 — 34 min of silence), so the split between fixed
  # setup (sandbox, slim dist, jdeps) and the sweeps is taken from the script's own note (58.1 of
  # 75.6 min = 77 % sweeps) and NOT from these jobs. Expected: map ~20-25 min, reduce ~15, chain
  # ~35-40 against 61 standalone. TUNE the caps below once two green runs have reported real times —
  # do not raise them to make a slow run fit, which is how corpus-contract.yml went 13 runs with
  # zero green.
  negtc-map:
    name: negtc sweeps ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # ── ON DEMAND ONLY (2026-08-01, owner's call). ────────────────────────────────────────────
    #
    # This gate is worth having and NOT worth running on a timer. What it proves — that the shipped
    # standard tier works with NO compiler present at all (no scalac, no javac, no scala-cli, no
    # compiler jars, `java.compiler` not even visible as a module) — changes only when the standard
    # tier's dependency surface changes, which is a deliberate act, not something that drifts
    # overnight. Against that it costs ~90 runner-minutes and ~40 min of wall clock per run.
    #
    # So it is `workflow_dispatch` only: run it before a release, or when you have touched what the
    # standard tier depends on. `gh workflow run ci.yml --ref main` and read
    # `negtc release gate (reduce)`.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      # One red shard must still let the others report. A partial verdict is what made the corpus
      # contract unreadable for 13 runs.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # ~7 min of setup+assembly plus a quarter of the sweeps. 35 is a guard with headroom, NOT the
    # operating point.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # node 24 and scala-cli mirror the `sbt` job deliberately: this gate builds its own sanitized
      # sandbox PATH and asserts scala-cli is unreachable *there*, so the host having them changes
      # nothing — but a DIFFERENT host shape would, and a release gate that behaves differently
      # depending on which job runs it is not a release gate.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Scala CLI
        uses: VirtusLab/scala-cli-setup@v1
        with:
          power: true
          jvm: temurin:21

      - name: Cache Coursier/sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      # RESTORE-ONLY, and it never saves. These jobs ride the `sbt` job's cache under its own
      # `-v2-sbt-` prefix; a shard saving under that key would let a partial build poison the job
      # that owns it, which is the exact poisoning the `sbt` job's own note documents.
      - name: Restore compiled classes (zinc)
        uses: actions/cache/restore@v4
        with:
          path: |
            **/target/scala-*/classes
            **/target/scala-*/test-classes
            **/target/scala-*/zinc
            **/target/streams
          key: ${{ runner.os }}-classes-v2-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-classes-v2-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-

      - name: Compile and assemble ssc.jar
        run: sbt compile cli/assembly installBin

      # F4 default-front flip note, moved here with the gate (v2-f4-reflip, 2026-07-22). F is the
      # DEFAULT front since 56d7d705f (2026-07-26), so this budget is LIVE, not slack: the two
      # full-corpus sweeps re-lower every one of the 212 corpus programs through F, the interpreted
      # self-hosting subset compiler — ~2-4x slower than the old ssc1-front+ssc1-lower (measured:
      # hello 0.8s->1.5s, heavy scljet 8s->32s). The frozen metrics stay put (frontend.ok/checker.ok
      # use the hardcoded legacy ssc1-run.ssc0 runner; vm/asm parity is front-independent and the
      # F4a fallback keeps F output == legacy) — only the WALL TIME grows. That is what the 75-min
      # ceiling used to cover for the whole corpus; a quarter of it gets 30. Deep F-perf is the F5b
      # typed-IR arc (BACKLOG).
      - name: negtc sweeps, shard ${{ matrix.shard }}/4
        timeout-minutes: 30
        run: |
          mkdir -p target/negtc
          tests/e2e/v21-negative-toolchain-release-gate.sh \
            --sweeps-only --shard ${{ matrix.shard }}/4 \
            --native-out target/negtc/native-${{ matrix.shard }}.tsv \
            --parity-out target/negtc/parity-${{ matrix.shard }}.tsv

      # A shard that swept nothing produces a header-only TSV, which merges cleanly and reduces to a
      # whole-corpus verdict about a fraction of the corpus. `negtc-merge-reports` cannot see it —
      # every row it got is real. So it is caught HERE, where the shard's own row count is known.
      # This repo has already shipped one gate that passed on an empty comparison (the mapreduce
      # gate, on its first run, "0 rows, byte-identical").
      - name: The shard actually swept something
        run: |
          for f in target/negtc/native-${{ matrix.shard }}.tsv target/negtc/parity-${{ matrix.shard }}.tsv; do
            rows=$(($(wc -l < "$f") - 1))
            printf '%s: %d rows\n' "$f" "$rows"
            [ "$rows" -ge 1 ] || { echo "negtc shard ${{ matrix.shard }}/4 swept 0 cases in $f" >&2; exit 1; }
          done

      - name: Upload shard reports
        uses: actions/upload-artifact@v4
        with:
          name: negtc-shard-${{ matrix.shard }}
          path: target/negtc/*.tsv
          retention-days: 3
          if-no-files-found: error

  negtc-reduce:
    name: negtc release gate (reduce)
    runs-on: ubuntu-latest
    needs: negtc-map
    # `needs` alone would skip this when a shard fails, collapsing "a shard died" and "the gate says
    # no" into the same grey skip. `!cancelled()`, NOT `always()`: with `always()` a cancelled run —
    # which this workflow's concurrency policy produces deliberately — would come back as a genuine
    # `failure` here, and `cancelled` already reads as red (MILESTONES.md). Manufacturing a second,
    # louder red out of a supersede is the exact apparatus failure this file's header documents.
    #
    # ORDER AND FORM ARE LOAD-BEARING, not style. `tests/e2e/ci-status-guard.sh` finds the jobs gated
    # off push by matching `^    if:` followed IMMEDIATELY by `github.event_name != 'push'`, and
    # cross-checks that set against `scripts/ci-status`'s required-job list. Written as
    # `${{ !cancelled() && github.event_name != 'push' }}` this job is invisible to that extractor —
    # so the tool that decides whether a run counts would silently stop requiring the job that
    # carries the verdict. Keep the event test first and unwrapped.
    # Dispatch-only, same as the map half above — and `!cancelled()` so a dead shard reads as a
    # failure with a message rather than a grey skip.
    if: github.event_name == 'workflow_dispatch' && !cancelled()
    timeout-minutes: 40

    steps:
      - name: Every shard must have reported
        if: needs.negtc-map.result != 'success'
        run: |
          echo "negtc-map: ${{ needs.negtc-map.result }} — the merged report would cover only part" >&2
          echo "of the corpus, and the taxonomy freezes below compare against WHOLE-corpus counts." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Scala CLI
        uses: VirtusLab/scala-cli-setup@v1
        with:
          power: true
          jvm: temurin:21

      - name: Cache Coursier/sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Restore compiled classes (zinc)
        uses: actions/cache/restore@v4
        with:
          path: |
            **/target/scala-*/classes
            **/target/scala-*/test-classes
            **/target/scala-*/zinc
            **/target/streams
          key: ${{ runner.os }}-classes-v2-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-classes-v2-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-

      # Reduce still needs the tower: it rebuilds the sanitized sandbox and the slim standard
      # distribution, and the negative assertions run real programs through that launcher.
      - name: Compile and assemble ssc.jar
        run: sbt compile cli/assembly installBin

      # The property this whole job rests on, proven on THIS commit before the verdict is taken from
      # it: map+merge over N shards is byte-identical to one unsharded sweep. It runs here, and not
      # in `Validate`, because it needs the launcher the step above stages — in a job without one it
      # silently degrades to its merge-invariant half and exits 0, which is a check that reports
      # success for a property it did not test. ~79 s, of which 78 are the real sweeps.
      - name: Verify negtc map+merge equals one unsharded sweep
        run: tests/e2e/negtc-mapreduce-gate.sh

      # ── front F: the gates that were invoked by nothing ────────────────────────────────────────
      # These four were written between 2026-08-08 and 08-09 and, like 52 of the 126 scripts in
      # tests/e2e, no workflow and no suite ran any of them. They are here rather than in smoke-ci
      # because they cost ~414 s together against smoke's ~233 s of headroom, and smoke-ci's own note
      # says a check that cannot finish inside the push interval belongs in the full suite.
      #
      # They SKIP, loudly, when the checkout has a launcher but no jars — the state a fresh worktree
      # is in. That guard is `tests/e2e/lib/ssc-usable.sh` and it is a functional probe, because the
      # `-x bin/ssc` test these gates used before is not the question and made all four report FAIL
      # in a fresh worktree.
      # Homed here rather than in smoke for a second reason on top of the budget one: `smoke-ci.ssc`
      # was held by another claim when this gate was written, and the overlap guard refused it. The
      # F gates already live here, so this is where it belongs anyway.
      - name: F keeps every alternative in `case A | B`
        run: tests/e2e/f-alternative-pattern-gate.sh

      - name: F lowers a bare call to a sibling member
        run: tests/e2e/f-bare-member-call-gate.sh

      - name: F lowers a val inline in a match arm
        run: tests/e2e/f-global-v-gate.sh

      - name: F lowers curried defs and varargs
        run: tests/e2e/f-curried-def-gate.sh

      - name: F passes an extern call site through verbatim
        run: tests/e2e/f-trailing-block-gate.sh

      - name: F keeps a chain of ++ a list
        run: tests/e2e/f-std-ui-gate.sh

      # The one that got past everything: a nested ctor pattern in a ONE-parameter lambda took F's
      # tryLamDirect fast path, which has no nested machinery, and the arm silently never fired.
      # Two parameters was always correct, so every probe with a second binder passes on the bug --
      # which is why this gate carries both shapes rather than just the failing one.
      - name: A nested pattern matches whatever binds the scrutinee
        run: tests/e2e/f-nested-pattern-lambda-gate.sh

      # An empty code fence still gets a block-end sentinel, and F consumed sentinels only AFTER
      # parsing an item -- so one arriving first was parsed as an expression and F refused the file
      # over a name the user never wrote. It then fell back to the reference front, so the OUTPUT
      # stayed right and only F's coverage was lost. This gate asserts the FRONT, not the output.
      - name: An empty code fence does not cost F the file
        run: tests/e2e/f-blockend-sentinel-gate.sh

      # `case "a" => acc = 5; acc` returned the assignment and dropped the rest, so F answered a
      # closure where both other lanes answer 5 — a wrong value at exit 0. The gate carries the
      # simple and the compound form, which continue differently (seq vs let), and the arm with no
      # continuation at all, which always worked.
      - name: An assignment at the head of an arm keeps the rest
        run: tests/e2e/f-assign-arm-body-gate.sh

      # Not an F gate: the REFERENCE front's lexer, and the one divergence this week where it was
      # the wrong one. Asserts BOTH fronts identically, because the two agreeing is the property.
      - name: A plain string literal ends at its closing quote
        run: tests/e2e/ref-front-string-literal-gate.sh

      # Also the reference front. The runner joins every fence into one source, so the block
      # boundary survives only as a sentinel; this front never emitted it and printed only the
      # whole program's final value, dropping every earlier block's tail. A ONE-block document
      # looked perfect either way, which is why the gate carries one-block rows too -- they are
      # the shape that passed on the bug.
      - name: Each code block prints its own tail
        run: tests/e2e/ref-front-multiblock-gate.sh

      # Also the reference front, and the same shape as the line above: an operator the OTHER two
      # lanes implement and this one silently did not. `--` had no token here at all, so the two
      # minus signs lexed as unary minus twice and `Set(1,2,3) -- Set(2)` quietly answered wrong.
      # Nothing was red, because nothing ran one source on all three lanes and compared. This does.
      # Deliberately NOT in the smoke suite: 4 probes × 3 lanes is 12 compiles, and smoke was cut
      # back to its budget the same day this landed. It belongs where runtime is not the constraint.
      - name: Three lanes agree on an operator
        run: tests/e2e/ref-front-three-defects-gate.sh

      # THE CORRECTNESS COUNTERPART TO THE COVERAGE CENSUS, and the reason it is worth its runtime:
      # every silent divergence found in front F this week — an arm body returning its first
      # statement, a curried extern losing its block, an extern vararg gaining a list it should not
      # have — left the COVERAGE number untouched, because all three files were lowered. To code that
      # answered wrongly. A suite that counts only coverage is green through every one of them.
      # Freezes three numbers, not one: F-worse as a ceiling, agreement as a floor, and the size of
      # the set it measured — so shrinking the corpus fails instead of passing.
      - name: F does not answer differently from the reference front
        run: tests/e2e/f-output-agreement-gate.sh

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: negtc-shard-*
          path: target/negtc-shards
          merge-multiple: true

      # The merge refuses a duplicated case and mismatched headers, and sorts rows so the merged
      # bytes do not depend on which shard finished first.
      - name: Merge the shard reports
        run: |
          mkdir -p target/negtc
          scripts/negtc-merge-reports target/negtc/native.tsv target/negtc-shards/native-*.tsv
          scripts/negtc-merge-reports target/negtc/parity.tsv target/negtc-shards/parity-*.tsv

      # The check the shards cannot make individually: the slices must add back up to the corpus.
      # A LOST ARTIFACT IS THE FAILURE THIS CATCHES, and it is invisible everywhere else — the merge
      # is happy with three shards (every row it got is real), and reduce would then measure 3/4 of
      # the corpus against taxonomy freezes written for all of it, i.e. report a product regression
      # that is really a missing download. A "more than half" floor would NOT catch it: three of four
      # shards is 75 %. So the count is exact, and derived from the corpus rather than frozen.
      #
      # native: one row per selected case, so the merged total is the corpus exactly (measured, run
      # 30635743363: `total: 214` against 214 examples/*.ssc).
      # parity: NOT pinned to the corpus — it has not been verified here that every branch of
      # bc-parity-sweep records a row. What is pinned is that the merge lost nothing: merged rows
      # must equal the sum of the four shard files.
      - name: The merged reports cover the whole corpus
        run: |
          rows() { echo $(($(wc -l < "$1") - 1)); }
          for kind in native parity; do
            n=$(ls target/negtc-shards/$kind-*.tsv | wc -l | tr -d ' ')
            printf '%s: %d shard file(s)\n' "$kind" "$n"
            [ "$n" -eq 4 ] || { echo "expected 4 $kind shard reports, downloaded $n" >&2; exit 1; }
            sum=0
            for f in target/negtc-shards/$kind-*.tsv; do sum=$((sum + $(rows "$f"))); done
            merged=$(rows "target/negtc/$kind.tsv")
            printf '%s: %d merged rows, %d summed across shards\n' "$kind" "$merged" "$sum"
            [ "$merged" -eq "$sum" ] || { echo "merge lost rows in $kind" >&2; exit 1; }
          done
          corpus=$(ls examples/*.ssc | wc -l)
          native=$(rows target/negtc/native.tsv)
          printf 'native: %d rows against a %d-case corpus\n' "$native" "$corpus"
          [ "$native" -eq "$corpus" ] || {
            echo "the merged native report does not cover the corpus — a shard is missing" >&2
            exit 1; }

      - name: ScalaScript 2.1 standard-only negative toolchain release gate (reduce)
        timeout-minutes: 30
        run: |
          tests/e2e/v21-negative-toolchain-release-gate.sh --reduce \
            --native-in target/negtc/native.tsv \
            --parity-in target/negtc/parity.tsv \
            --report target/v21-negative-toolchain-release.tsv

      - name: Upload the merged release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: negtc-release-report
          path: |
            target/negtc/*.tsv
            target/v21-negative-toolchain-release.tsv
          retention-days: 7
          if-no-files-found: warn

  # ── the sbt test phase, sharded by SUITE ────────────────────────────────────────────────────────
  #
  # MEASURED: 82.6 min in one job (106.5 before the eager-clue fix), against ~20 min for the gates
  # job it used to sit behind. Inside the dominant suite the load is FLAT — 17 cases, each 94-240 s
  # — so nothing here gets faster; only parallelism pays. Sharding BY PROJECT does not balance
  # either: one project block was 88.5 min of 123.9. Hence per-SUITE.
  #
  # `scripts/sbt-test-shard` enumerates every `<project>/<suite>` from `show test:definedTestNames`,
  # sorts, and takes `idx % N == i`. On the real listing that is 1099 suites split 274/275/275/275,
  # union exactly 1099, zero duplicated, zero missing.
  #
  # ⚠️ A SHARD SCHEME THAT DROPS A SUITE FAILS GREEN — every shard passes and the union covers less
  # than the whole. `tests/e2e/sbt-test-shard-gate.sh` pins the partition on a synthetic listing and
  # runs on every push in `scripts/smoke-ci`; the runner additionally refuses an enumeration under
  # ten suites and refuses to RUN an empty slice, because `testOnly` with no arguments runs
  # everything and would look like a fast green.
  interpreter-fast:
    name: Interpreter fast lane
    runs-on: ubuntu-latest
    # TIER 2 — nightly, PR and dispatch, like `validate` and `conformance`. Deliberately NOT tier 3.
    #
    # The interpreter suite is 1854 tests and reaches a verdict only when somebody dispatches
    # `sbt-test` below. That is how THIRTEEN red tests sat unnoticed until 2026-08-10: eleven were a
    # single stale path from the `v1-runtime-std` rename across five files and three suites, and two
    # were a disagreement between the corpus and a test suite about where an import resolves. Both
    # causes were introduced by careful commits that had no way to learn they had broken something.
    #
    # WHY THE FAST LANE AND NOT THE WHOLE SUITE. Measured on a dev host: one shell-out suite is 221 s
    # for 4 tests (~55 s/test) while in-process tests run ~0.3 s/test. 31 of 156 files shell out to
    # `scala-cli` or `node`, holding 262 of the tests; `backendInterpreter/testFast` excludes exactly
    # those and is **1608 tests, 0 failures, 163 s**. The heavy lanes stay in `sbt-test`, which is
    # sharded and dispatch-only for the reasons its own comment gives.
    #
    # WHY NOT SMOKE: smoke is 27 checks in ~157 s and is the per-push signal. Adding 163 s would
    # DOUBLE it. A nightly-and-PR verdict is the right cadence for 1608 tests; the push path stays
    # the fast first word.
    #
    # JDK ONLY, AND THAT IS ALSO THE TEST. The fast lane is defined as the tests that do not shell
    # out, so it should need neither node nor scala-cli. This job installs neither. If a suite the
    # heuristic in `build.sbt` calls "fast" secretly starts a process, this is where it surfaces —
    # on a nightly, naming itself, rather than inside somebody's unrelated change.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Interpreter fast lane
        run: sbt -batch backendInterpreter/testFast

  sbt-test:
    name: sbt test shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # Tier 3, dispatch-only, exactly like the gates job it was split out of.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      # One red shard must still let the others report; a partial verdict is what made the corpus
      # contract unreadable for 13 runs.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # ~6 min compile + ~21 min of slice. 60 is a guard with headroom, NOT the operating point —
    # if a shard approaches it, read the per-suite cost rather than raising this.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # node enables the interp==JS(node) leg of CrossBackendPropertyTest (the
      # cross-backend differential) under `sbt test`. Without it the test skips
      # via `assume(has("node"))`. The interp==JVM(scala-cli) leg stays gated and
      # is covered by the Conformance job; subprocess hangs are bounded by
      # ProcTestUtil.runCaptured, so a wedged child fails fast, not the whole job.
      #
      # node 24, not 20: `emit-wasm` output needs a modern V8 for TWO separate
      # reasons, and CI found them one at a time (node 20 -> 22 -> 24):
      #   1. it is a **WasmGC** module — node 20 gives
      #      `CompileError: Unknown type code 0x5e, enable with --experimental-wasm-gc`.
      #      The flag is NOT a portable workaround: modern node rejects it outright
      #      ("bad option") because WasmGC is standard there.
      #   2. its `__loader.js` instantiates with
      #      `{ builtins: ["js-string"], importedStringConstants: "" }` — the
      #      **imported string constants** proposal. 364 of the module's 484 imports
      #      have module name `""` and are satisfied by that option, so a V8 that
      #      ignores it (node 22) fails with
      #      `TypeError: Import #120 module="": module is not an object or function`.
      # So the requirement is a node whose V8 has WasmGC *and* JS string builtins.
      # This only surfaced now: the wasm target smoke had never run in CI (an earlier
      # step always failed first) and it passes on developers' newer local node.
      # Only this job runs that gate; the other two stay on 20 deliberately, to avoid
      # perturbing a green conformance lane.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      # `ssc-tools emit-wasm` shells out to scala-cli, so the wasm TARGET lane of the
      # explicit-lanes gate below needs it on PATH (its dependency_tier is literally
      # `wasm-target-tools`). Without it that gate died with
      # `Cannot run program "scala-cli"` — invisible for as long as the gate failed
      # earlier, on the mcp provider lane. This does NOT weaken the compiler-free
      # story: the negative-toolchain gate builds its own sandbox PATH and asserts
      # scala-cli is unreachable there, so it is unaffected by the tool existing on
      # the runner.
      - name: Setup Scala CLI
        uses: VirtusLab/scala-cli-setup@v1
        with:
          power: true
          jvm: temurin:21

      - name: Cache Coursier/sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      # Same classes+zinc cache as the conformance job: without it this job
      # recompiles all ~259 modules from scratch every run. Restore-only +
      # save-on-success (see the end of this job) — a failed build must never
      # re-save the cache, or a stale crypto-spi `classes` dir poisons every
      # later run (zinc skips crypto-spi → dependents can't see
      # scalascript.crypto.*). The `-v2-` prefix discards the poisoned caches.
      - name: Restore compiled classes (zinc)
        uses: actions/cache/restore@v4
        with:
          path: |
            **/target/scala-*/classes
            **/target/scala-*/test-classes
            **/target/scala-*/zinc
            **/target/streams
          key: ${{ runner.os }}-classes-v2-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-${{ github.sha }}
          # ONLY this job's own prefix — do NOT fall back to the conformance job's
          # …-v2-conf- cache: their zinc analyses are incompatible and sharing
          # re-poisons crypto-spi (see the conformance Restore step's note).
          # See the conformance job's note — key by build.sbt hash so a module-graph
          # change cold-rebuilds instead of restoring stale classes (poison).
          restore-keys: |
            ${{ runner.os }}-classes-v2-sbt-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-

      # installBin stages bin/lib/compiler/jars — the Scala compiler jars that
      # `compile-jvm --bytecode` / `link` load lazily via ssc.lib.path. The CLI
      # subprocess smoke tests (EmitScalaFacadeCliTest, link-tier tests) walk up
      # from the assembled jar to find them; without staging they fail with
      # "CompilerLoader: ssc.lib.path is not set".
      - name: Compile and assemble ssc.jar
        run: sbt compile cli/assembly installBin

      # The enumeration this needs is a by-product of the compile above, so the slice costs no extra
      # build. `--shard i/4` prints what it selected before running anything.
      - name: Test via sbt, shard ${{ matrix.shard }}/4
        timeout-minutes: 50
        run: |
          set -o pipefail
          scripts/sbt-test-shard --shard ${{ matrix.shard }}/4 2>&1 | tee /tmp/sbt-test.log

      # Runs ONLY when the step above failed — the situation where the log says "All tests passed."
      # and the exit says otherwise, and where readers have spent hours hunting an assertion that
      # does not exist. Advisory: `|| true` never turns a red step green.
      - name: Diagnose a silent fork exit
        if: failure()
        run: scripts/detect-fork-exit /tmp/sbt-test.log || true
